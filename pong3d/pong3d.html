<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D PONG — RetroVR Console</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0b0b14; overflow: hidden; }
    #scoreboard {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 20px; align-items: center; pointer-events: none;
    }
    .score-group { display: flex; align-items: center; gap: 10px; }
    .pip { width: 13px; height: 13px; flex-shrink: 0; }
    #score-p1, #score-p2 {
      color: #fff; font-size: 64px; font-family: 'Courier New', monospace;
      font-weight: bold; line-height: 1; user-select: none;
    }
    @keyframes blink { 50% { opacity: 0; } }
    #attract {
      position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
      color: #fff; font-size: 16px; font-family: 'Courier New', monospace;
      letter-spacing: 5px; pointer-events: none; opacity: 0; transition: opacity 0.6s;
    }
    #attract.visible { opacity: 1; animation: blink 1.2s step-end infinite; }
  </style>
</head>
<body>
<div id="scoreboard">
  <div class="score-group">
    <div class="pip" style="background:#3377dd"></div>
    <span id="score-p1">0</span>
  </div>
  <div class="score-group">
    <div class="pip" style="background:#dd3355"></div>
    <span id="score-p2">0</span>
  </div>
</div>
<div id="attract">PRESS ANY KEY</div>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Renderer ──────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);

// Custom VR button — shows error text if session fails so we can diagnose
(async () => {
  const btn = document.createElement('button');
  btn.style.cssText = 'position:absolute;bottom:20px;left:calc(50% - 55px);width:110px;' +
    'padding:12px 6px;background:rgba(0,0,0,0.1);color:#fff;font-family:sans-serif;' +
    'font-size:13px;border:1px solid #fff;z-index:999;cursor:pointer;opacity:0.5;';
  document.body.appendChild(btn);

  if (!('xr' in navigator)) { btn.textContent = 'NO WEBXR'; return; }
  const supported = await navigator.xr.isSessionSupported('immersive-vr').catch(() => false);
  if (!supported) { btn.textContent = 'VR NOT SUPPORTED'; return; }

  btn.textContent = 'ENTER VR';
  btn.addEventListener('mouseenter', () => { btn.style.opacity = '1'; });
  btn.addEventListener('mouseleave', () => { btn.style.opacity = '0.5'; });

  let xrCurrentSession = null;

  async function enterVR() {
    if (xrCurrentSession) { xrCurrentSession.end(); return; }
    try {
      const session = await navigator.xr.requestSession('immersive-vr', {
        requiredFeatures: ['local-floor']
      });
      await renderer.xr.setSession(session);
      btn.textContent = 'EXIT VR';
      xrCurrentSession = session;
      session.addEventListener('end', () => {
        xrCurrentSession = null;
        btn.textContent = 'ENTER VR';
      });
    } catch (e) {
      btn.textContent = e.name || 'ERROR';
      setTimeout(() => { btn.textContent = 'ENTER VR'; }, 3000);
      console.error('WebXR error:', e);
    }
  }

  btn.addEventListener('click', enterVR);
  btn.addEventListener('touchend', e => { e.preventDefault(); enterVR(); });
})();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0b14);

// ── Arena constants — official table-tennis proportions ───────────────────────
const AW = 1.525;   // arena width  (x: −0.7625 → +0.7625)
const AH = 0.762;   // arena height (y: AY     → AY + AH)
const AD = 2.74;    // arena depth  (z: 0      → AD, P1=0 P2=AD)
const AY = 0.76;    // floor y — standard table-tennis height
const BALL_R     = 0.024;
const PADDLE_R   = 0.080;
const PADDLE_INSET = 0.15;

const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.01, 60);
camera.position.set(2.6, 3.4, -0.7);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, AY + AH / 2, AD / 2);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 0.8;
controls.maxDistance = 10;
controls.update();

// ── Camera animation — supports intro↔game transitions ───────────────────────
const CAM_INTRO_POS    = new THREE.Vector3(2.6, 3.4, -0.7);
const CAM_INTRO_TARGET = new THREE.Vector3(0, AY + AH / 2, AD / 2);
const CAM_GAME_POS     = new THREE.Vector3(0, AY + AH * 0.5, -0.5);
const CAM_GAME_TARGET  = new THREE.Vector3(0, AY + AH * 0.45, AD * 0.35);
const CAM_ANIM_DURATION = 1.5;
let camAnimTime = -1;
let camAtGame   = false;
let gameState   = 'attract';  // 'attract' | 'playing'

const _camFrom = new THREE.Vector3(), _camFromT = new THREE.Vector3();
const _camTo   = new THREE.Vector3(), _camToT   = new THREE.Vector3();
let _camOnDone = null;

function startCamAnim(fromPos, fromTgt, toPos, toTgt, onDone) {
  _camFrom.copy(fromPos); _camFromT.copy(fromTgt);
  _camTo.copy(toPos);     _camToT.copy(toTgt);
  camAnimTime = 0;
  _camOnDone  = onDone || null;
  controls.enabled = false;
}

// ── Arena geometry ────────────────────────────────────────────────────────────

// Table surface: green plane with white line markings
function addTableFace(y, normal_up) {
  // Green fill
  const surf = new THREE.Mesh(
    new THREE.PlaneGeometry(AW, AD),
    new THREE.MeshBasicMaterial({ color: 0x1d6b28, transparent: true, opacity: 0.45, side: THREE.DoubleSide })
  );
  surf.rotation.x = -Math.PI / 2;
  surf.position.set(0, y, AD / 2);
  scene.add(surf);

  // Thick white line markings — flat BoxGeometry strips (WebGL ignores linewidth)
  const LH = 0.002;   // 2 mm tall — just proud of the surface
  const LW = 0.012;   // 12 mm wide line
  const ly = y + (normal_up ? LH / 2 : -LH / 2);
  const wm = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const addLine = (w, d, x, z) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, LH, d), wm);
    m.position.set(x, ly, z);
    scene.add(m);
  };
  // Border rectangle — end strips extend past corners so joins are clean
  addLine(LW,        AD + LW, -AW / 2, AD / 2);  // left edge
  addLine(LW,        AD + LW,  AW / 2, AD / 2);  // right edge
  addLine(AW + LW,   LW,      0,       0);        // near end
  addLine(AW + LW,   LW,      0,       AD);       // far end
  // Interior markings
  addLine(AW,        LW,      0,       AD / 2);   // net line
  addLine(LW,        AD,      0,       AD / 2);   // centre line
}

addTableFace(AY,       true);   // floor — normal faces up
addTableFace(AY + AH,  false);  // ceiling — normal faces down (into arena)

// Side walls — translucent green panels with visible edges
function addSideWall(x) {
  const sign = x > 0 ? 1 : -1;
  const geo = new THREE.PlaneGeometry(AD, AH);

  const fill = new THREE.Mesh(geo,
    new THREE.MeshBasicMaterial({ color: 0x1d6b28, transparent: true, opacity: 0.45, side: THREE.DoubleSide })
  );
  fill.rotation.y = -sign * Math.PI / 2;
  fill.position.set(x, AY + AH / 2, AD / 2);
  scene.add(fill);

  const edgeLines = new THREE.LineSegments(
    new THREE.EdgesGeometry(geo),
    new THREE.LineBasicMaterial({ color: 0x2a9436 })
  );
  edgeLines.rotation.y = -sign * Math.PI / 2;
  edgeLines.position.set(x, AY + AH / 2, AD / 2);
  scene.add(edgeLines);

  // Vertical centre line at z = AD/2, matching the table markings
  const cl = new THREE.Mesh(
    new THREE.BoxGeometry(0.002, AH, 0.012),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  cl.position.set(x + (sign > 0 ? -0.002 : 0.002), AY + AH / 2, AD / 2);
  scene.add(cl);
}
addSideWall(-AW / 2);
addSideWall( AW / 2);

// End walls — clear by default, flash colour when the ball scores at that end
// Colours swapped from end assignment: flash = who scored, not who conceded.
// P1 (blue) scores at P2's end → P2 wall flashes blue. P2 (red) scores at P1's end → P1 wall flashes red.
const p1WallMat = new THREE.MeshBasicMaterial({ color: 0xdd3355, transparent: true, opacity: 0, side: THREE.DoubleSide });
const p2WallMat = new THREE.MeshBasicMaterial({ color: 0x3377dd, transparent: true, opacity: 0, side: THREE.DoubleSide });
const wallFlash = [0, 0];  // countdown timers, seconds

{
  const geo = new THREE.PlaneGeometry(AW, AH);
  const w1 = new THREE.Mesh(geo, p1WallMat);
  w1.position.set(0, AY + AH / 2, 0);
  scene.add(w1);
  const w2 = new THREE.Mesh(geo, p2WallMat);
  w2.position.set(0, AY + AH / 2, AD);
  scene.add(w2);
}

// Subtle room floor beneath the table
scene.add(new THREE.GridHelper(12, 30, 0x141420, 0x111118));

// ── Ball ──────────────────────────────────────────────────────────────────────
const ballMesh = new THREE.Mesh(
  new THREE.SphereGeometry(BALL_R, 14, 10),
  new THREE.MeshBasicMaterial({ color: 0xffffff })
);
scene.add(ballMesh);

// Glow sprite — scaled ~12× the physical ball so it reads clearly
{
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0,   'rgba(255,255,255,1)');
  g.addColorStop(0.3, 'rgba(255,255,255,0.5)');
  g.addColorStop(1,   'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 64, 64);
  const sprite = new THREE.Sprite(
    new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false })
  );
  sprite.scale.set(0.30, 0.30, 1);
  ballMesh.add(sprite);
}

// Ball trail
const TRAIL = 22;
const trailMeshes = Array.from({ length: TRAIL }, (_, i) => {
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(BALL_R * (1 - i / TRAIL) * 0.7, 6, 4),
    new THREE.MeshBasicMaterial({
      color: 0xffffff, transparent: true,
      opacity: (1 - i / TRAIL) * 0.32, depthWrite: false
    })
  );
  scene.add(m);
  return m;
});
const trailBuf = Array.from({ length: TRAIL }, () => new THREE.Vector3(-99, 0, 0));
let trailHead = 0;
function pushTrail(pos) {
  trailBuf[trailHead].copy(pos);
  trailHead = (trailHead + 1) % TRAIL;
  for (let i = 0; i < TRAIL; i++)
    trailMeshes[i].position.copy(trailBuf[(trailHead + TRAIL - 1 - i) % TRAIL]);
}

// ── Paddle helper ─────────────────────────────────────────────────────────────
// Table-tennis paddle: circular rubber face, short handle stub below
function makePaddle(faceColor, rimColor) {
  const g = new THREE.Group();
  const faceMat = new THREE.MeshBasicMaterial({ color: faceColor, transparent: true, opacity: 0.35, side: THREE.DoubleSide });
  g.add(new THREE.Mesh(new THREE.CircleGeometry(PADDLE_R, 40), faceMat));
  g.add(new THREE.Mesh(
    new THREE.TorusGeometry(PADDLE_R, 0.005, 8, 40),
    new THREE.MeshBasicMaterial({ color: rimColor })
  ));
  return { group: g, faceMat };
}

const { group: paddle1, faceMat: p1FaceMat } = makePaddle(0x3377dd, 0x88bbff);
const { group: paddle2, faceMat: p2FaceMat } = makePaddle(0xdd3355, 0xff88aa);
scene.add(paddle1);
scene.add(paddle2);
const paddleFlash = [0, 0];

// Miss rings — ghost circle at the exact XY where the ball crossed your paddle plane.
// Opposing team's colour so you read it as "they scored here".
function makeMissRing(color, z) {
  const g = new THREE.Group();
  const fillMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false });
  const rimMat  = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0, depthWrite: false });
  g.add(new THREE.Mesh(new THREE.CircleGeometry(BALL_R, 24), fillMat));
  g.add(new THREE.Mesh(new THREE.TorusGeometry(BALL_R, 0.004, 8, 24), rimMat));
  g.position.z = z;
  scene.add(g);
  return { group: g, fillMat, rimMat };
}
const miss1 = makeMissRing(0xffffff, PADDLE_INSET);
const miss2 = makeMissRing(0xffffff, AD - PADDLE_INSET);
const missFlash    = [0, 0];
const missDetected = [false, false];
const missPos      = [new THREE.Vector2(), new THREE.Vector2()];

// Bounce rings — pool of rings reused round-robin on each wall/floor/ceiling bounce
const BOUNCE_POOL = 8;
const bounceRings = Array.from({ length: BOUNCE_POOL }, () => {
  const g       = new THREE.Group();
  const fillMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false });
  const rimMat  = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, depthWrite: false });
  g.add(new THREE.Mesh(new THREE.CircleGeometry(BALL_R * 0.55, 24), fillMat));
  g.add(new THREE.Mesh(new THREE.TorusGeometry(BALL_R * 0.55, 0.003, 8, 24), rimMat));
  scene.add(g);
  return { group: g, fillMat, rimMat, flash: 0 };
});
let bounceRingIdx = 0;

function triggerBounceRing(x, y, z, axis) {
  const r = bounceRings[bounceRingIdx++ % BOUNCE_POOL];
  r.group.position.set(x, y, z);
  r.group.rotation.set(0, 0, 0);
  if (axis === 'x') r.group.rotation.y = Math.PI / 2;
  if (axis === 'y') r.group.rotation.x = Math.PI / 2;
  r.flash = 1.0;
}

// ── Game state ────────────────────────────────────────────────────────────────
const ball = {
  pos: new THREE.Vector3(0, AY + AH * 0.55, AD * 0.5),
  vel: new THREE.Vector3(),
};
const p1 = { x: 0, y: AY + AH * 0.55 };
const p2 = { x: 0, y: AY + AH * 0.55 };
const score = [0, 0];
let serving = true;
let servePhase = 'drop';  // 'drop' | 'pause'
let serveTimer = 0;

const scoreP1El = document.getElementById('score-p1');
const scoreP2El = document.getElementById('score-p2');
const attractEl = document.getElementById('attract');

function clampPaddle(p) {
  // Centre can reach the wall line itself — half the paddle overlaps the edge
  p.x = THREE.MathUtils.clamp(p.x, -AW / 2, AW / 2);
  p.y = THREE.MathUtils.clamp(p.y,  AY,      AY + AH);
}

const DROP_START_Y   = AY + AH;
const DROP_END_Y     = AY + AH * 0.55;
const DROP_DURATION  = 1.1;
const PAUSE_DURATION = 0.35;

function startServe(afterPoint = false) {
  missDetected[0] = missDetected[1] = false;
  ball.vel.set(0, 0, 0);
  serving = true;
  if (!afterPoint && !camAtGame && camAnimTime < 0) {
    startCamAnim(CAM_INTRO_POS, CAM_INTRO_TARGET, CAM_GAME_POS, CAM_GAME_TARGET,
                 () => { camAtGame = true; });
  }
  if (afterPoint) {
    servePhase = 'wait';
    serveTimer = 0.8;  // freeze ball in place so the miss registers visually
  } else {
    ball.pos.set(0, DROP_START_Y, AD * 0.5);
    servePhase = 'drop';
    serveTimer = DROP_DURATION;
    for (let i = 0; i < TRAIL; i++) trailBuf[i].set(-99, 0, 0);
  }
}

function serve() {
  const az = (Math.random() - 0.5) * 0.5;
  const ay = (Math.random() - 0.5) * 0.25;
  const dir = Math.random() < 0.5 ? 1 : -1;
  const spd = 2.4;
  ball.vel.set(Math.sin(az) * spd, Math.sin(ay) * spd, dir * Math.cos(az) * spd);
  serving = false;
}

function serveAttract() {
  ball.pos.set(0, AY + AH * 0.5, AD * 0.5);
  for (let i = 0; i < TRAIL; i++) trailBuf[i].set(-99, 0, 0);
  const az = (Math.random() - 0.5) * 1.2;
  const ay = (Math.random() - 0.5) * 0.6;
  const dir = Math.random() < 0.5 ? 1 : -1;
  const spd = 1.8;
  ball.vel.set(Math.sin(az) * spd, Math.sin(ay) * spd, dir * Math.cos(az) * spd);
}

function enterAttractMode(fromGame = false) {
  gameState = 'attract';
  serving   = false;
  paddle1.visible = false;
  paddle2.visible = false;
  serveAttract();
  if (fromGame) {
    startCamAnim(camera.position.clone(), controls.target.clone(),
                 CAM_INTRO_POS, CAM_INTRO_TARGET,
                 () => { camAtGame = false; attractEl.classList.add('visible'); });
  } else {
    camAtGame = false;
    attractEl.classList.add('visible');
  }
}

function startGame() {
  gameState = 'playing';
  score[0] = score[1] = 0;
  scoreP1El.textContent = '0';
  scoreP2El.textContent = '0';
  paddle1.visible = true;
  paddle2.visible = true;
  attractEl.classList.remove('visible');
  startServe();
}

enterAttractMode();

// ── Angular deflection (Pong-style) ──────────────────────────────────────────
// Centre hit → ball returns straight (flat angle).
// Edge hit   → maximum deflection of MAX_DEFLECT_ANGLE.
// The angle is proportional to normalised distance from paddle centre.
const MAX_DEFLECT = 55 * Math.PI / 180;  // 55° at the very edge
const HIT_SPEEDUP = 1.055;              // slight speed gain per rally hit
const MAX_SPEED   = 6.0;               // m/s hard cap

function applyPaddleHit(paddleX, paddleY, newZSign, paddleIdx) {
  paddleFlash[paddleIdx] = 1.0;
  const dx = ball.pos.x - paddleX;
  const dy = ball.pos.y - paddleY;
  const hitDist = Math.sqrt(dx * dx + dy * dy);
  const norm    = Math.min(hitDist / PADDLE_R, 1.0);   // 0=centre 1=edge

  const spd          = Math.min(ball.vel.length() * HIT_SPEEDUP, MAX_SPEED);
  const deflectAngle = norm * MAX_DEFLECT;
  const fwd          = Math.cos(deflectAngle);   // component along z (towards opponent)
  const lat          = Math.sin(deflectAngle);   // component in xy plane

  // Lateral direction: unit vector pointing from paddle centre to hit point.
  // If the ball hits dead centre, keep the lateral component zero.
  const latX = hitDist > 0.001 ? dx / hitDist : 0;
  const latY = hitDist > 0.001 ? dy / hitDist : 0;

  ball.vel.set(latX * lat * spd, latY * lat * spd, newZSign * fwd * spd);
}

// ── Mouse → P1 paddle ─────────────────────────────────────────────────────────
// Project mouse ray onto the P1 paddle plane (z = PADDLE_INSET).
const raycaster = new THREE.Raycaster();
const mouse2    = new THREE.Vector2();
const p1Plane   = new THREE.Plane(new THREE.Vector3(0, 0, 1), -PADDLE_INSET);

// Desktop: any key starts the game
window.addEventListener('keydown', () => {
  if (gameState === 'attract' && camAnimTime < 0) startGame();
});

window.addEventListener('mousemove', e => {
  if (renderer.xr.isPresenting) return;
  mouse2.set(
     (e.clientX / innerWidth)  * 2 - 1,
    -(e.clientY / innerHeight) * 2 + 1
  );
  raycaster.setFromCamera(mouse2, camera);
  const hit = new THREE.Vector3();
  if (raycaster.ray.intersectPlane(p1Plane, hit)) {
    p1.x = hit.x; p1.y = hit.y;
    clampPaddle(p1);
  }
});

// ── CPU P2 ────────────────────────────────────────────────────────────────────
const CPU_SPEED = 1.5;
const CPU_ERROR = 0.040;  // fixed offset, makes CPU beatable with angled shots
let cpuOff = { x: 0, y: 0 };

function resetCpuOff() {
  const r = CPU_ERROR * (0.5 + Math.random() * 0.5);
  const a = Math.random() * Math.PI * 2;
  cpuOff.x = Math.cos(a) * r;
  cpuOff.y = Math.sin(a) * r;
}
resetCpuOff();

function updateCpu(dt) {
  if (renderer.xr.isPresenting) return;
  const tx = ball.pos.x + cpuOff.x;
  const ty = ball.pos.y + cpuOff.y;
  const dx = tx - p2.x, dy = ty - p2.y;
  const d  = Math.sqrt(dx * dx + dy * dy);
  const s  = Math.min(d, CPU_SPEED * dt);
  if (d > 0.001) { p2.x += (dx / d) * s; p2.y += (dy / d) * s; }
  clampPaddle(p2);
}

// ── WebXR — hand & controller tracking ───────────────────────────────────────
let xrSession = null;
renderer.xr.addEventListener('sessionstart', () => {
  xrSession = renderer.xr.getSession();
  // WebXR default forward is -Z; our arena extends in +Z — rotate 180° around Y
  const refSpace = renderer.xr.getReferenceSpace();
  if (refSpace) {
    renderer.xr.setReferenceSpace(
      refSpace.getOffsetReferenceSpace(
        new XRRigidTransform({ x: 0, y: 0, z: 0, w: 1 }, { x: 0, y: 1, z: 0, w: 0 })
      )
    );
  }
  if (gameState === 'attract' && camAnimTime < 0) startGame();
});
renderer.xr.addEventListener('sessionend', () => { xrSession = null; });

const grip1 = renderer.xr.getControllerGrip(0);
const grip2 = renderer.xr.getControllerGrip(1);
scene.add(grip1, grip2);

function updateXRPaddles(frame) {
  if (!xrSession || !frame) return;
  const rs = renderer.xr.getReferenceSpace();
  if (!rs) return;
  for (const src of xrSession.inputSources) {
    const target = src.handedness === 'left' ? p1 : p2;
    if (src.hand) {
      const wrist = src.hand.get('wrist');
      if (wrist) {
        const pose = frame.getJointPose(wrist, rs);
        if (pose) { target.x = pose.transform.position.x; target.y = pose.transform.position.y; clampPaddle(target); }
      }
    } else if (src.gripSpace) {
      const pose = frame.getPose(src.gripSpace, rs);
      if (pose) { target.x = pose.transform.position.x; target.y = pose.transform.position.y; clampPaddle(target); }
    }
  }
}

// ── Ball physics ──────────────────────────────────────────────────────────────
function updateBall(dt) {
  if (serving) {
    if (servePhase === 'wait') {
      if ((serveTimer -= dt) <= 0) {
        ball.pos.set(0, DROP_START_Y, AD * 0.5);
        servePhase = 'drop';
        serveTimer = DROP_DURATION;
        for (let i = 0; i < TRAIL; i++) trailBuf[i].set(-99, 0, 0);
      }
    } else if (servePhase === 'drop') {
      serveTimer -= dt;
      const t    = Math.max(0, 1 - serveTimer / DROP_DURATION);
      const ease = t * t * (3 - 2 * t);  // smoothstep — slow start, slow finish
      ball.pos.set(0, DROP_START_Y + (DROP_END_Y - DROP_START_Y) * ease, AD * 0.5);
      if (serveTimer <= 0) { ball.pos.set(0, DROP_END_Y, AD * 0.5); servePhase = 'pause'; serveTimer = PAUSE_DURATION; }
    } else {
      if ((serveTimer -= dt) <= 0) serve();
    }
    return;
  }

  ball.pos.addScaledVector(ball.vel, dt);

  // Side walls (x)
  if (ball.pos.x < -AW / 2 + BALL_R) {
    ball.pos.x = -AW / 2 + BALL_R; ball.vel.x = Math.abs(ball.vel.x);
    triggerBounceRing(-AW / 2, ball.pos.y, ball.pos.z, 'x');
  } else if (ball.pos.x > AW / 2 - BALL_R) {
    ball.pos.x = AW / 2 - BALL_R; ball.vel.x = -Math.abs(ball.vel.x);
    triggerBounceRing(AW / 2, ball.pos.y, ball.pos.z, 'x');
  }
  // Floor / ceiling (y)
  if (ball.pos.y < AY + BALL_R) {
    ball.pos.y = AY + BALL_R; ball.vel.y = Math.abs(ball.vel.y);
    triggerBounceRing(ball.pos.x, AY, ball.pos.z, 'y');
  } else if (ball.pos.y > AY + AH - BALL_R) {
    ball.pos.y = AY + AH - BALL_R; ball.vel.y = -Math.abs(ball.vel.y);
    triggerBounceRing(ball.pos.x, AY + AH, ball.pos.z, 'y');
  }

  // Attract mode — end walls bounce the ball; skip paddle logic
  if (gameState === 'attract') {
    if (ball.vel.z < 0 && ball.pos.z < BALL_R) {
      ball.pos.z = BALL_R; ball.vel.z = Math.abs(ball.vel.z);
      triggerBounceRing(ball.pos.x, ball.pos.y, 0, 'z');
    } else if (ball.vel.z > 0 && ball.pos.z > AD - BALL_R) {
      ball.pos.z = AD - BALL_R; ball.vel.z = -Math.abs(ball.vel.z);
      triggerBounceRing(ball.pos.x, ball.pos.y, AD, 'z');
    }
    return;
  }

  // P1 paddle (ball approaching z = 0)
  if (ball.vel.z < 0 && ball.pos.z < PADDLE_INSET + BALL_R) {
    const dx = ball.pos.x - p1.x, dy = ball.pos.y - p1.y;
    if (Math.sqrt(dx * dx + dy * dy) < PADDLE_R + BALL_R) {
      ball.pos.z = PADDLE_INSET + BALL_R;
      applyPaddleHit(p1.x, p1.y, +1, 0);
      resetCpuOff();
    } else {
      if (!missDetected[0] && ball.pos.z <= PADDLE_INSET) {
        missDetected[0] = true;
        miss1.group.position.set(ball.pos.x, ball.pos.y, PADDLE_INSET);
        missFlash[0] = 1.0;
      }
      if (ball.pos.z < -0.25) {
        score[1]++; scoreP1El.textContent = score[0]; scoreP2El.textContent = score[1];
        wallFlash[0] = 1.0;
        if (score[1] >= 11) enterAttractMode(true); else startServe(true);
      }
    }
  }

  // P2 paddle (ball approaching z = AD)
  if (ball.vel.z > 0 && ball.pos.z > AD - PADDLE_INSET - BALL_R) {
    const dx = ball.pos.x - p2.x, dy = ball.pos.y - p2.y;
    if (Math.sqrt(dx * dx + dy * dy) < PADDLE_R + BALL_R) {
      ball.pos.z = AD - PADDLE_INSET - BALL_R;
      applyPaddleHit(p2.x, p2.y, -1, 1);
    } else {
      if (!missDetected[1] && ball.pos.z >= AD - PADDLE_INSET) {
        missDetected[1] = true;
        miss2.group.position.set(ball.pos.x, ball.pos.y, AD - PADDLE_INSET);
        missFlash[1] = 1.0;
      }
      if (ball.pos.z > AD + 0.25) {
        score[0]++; scoreP1El.textContent = score[0]; scoreP2El.textContent = score[1];
        wallFlash[1] = 1.0;
        if (score[0] >= 11) enterAttractMode(true); else startServe(true);
      }
    }
  }
}

// ── Resize ────────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Main loop ─────────────────────────────────────────────────────────────────
const clock = new THREE.Clock();

renderer.setAnimationLoop((time, frame) => {
  const dt = Math.min(clock.getDelta(), 0.05);

  if (frame) updateXRPaddles(frame);
  else       updateCpu(dt);

  updateBall(dt);
  if (wallFlash[0] > 0) { wallFlash[0] = Math.max(0, wallFlash[0] - dt / 0.5); p1WallMat.opacity = wallFlash[0] * 0.6; }
  if (wallFlash[1] > 0) { wallFlash[1] = Math.max(0, wallFlash[1] - dt / 0.5); p2WallMat.opacity = wallFlash[1] * 0.6; }
  if (paddleFlash[0] > 0) { paddleFlash[0] = Math.max(0, paddleFlash[0] - dt / 1.2); p1FaceMat.opacity = 0.35 + paddleFlash[0] * 0.55; }
  if (paddleFlash[1] > 0) { paddleFlash[1] = Math.max(0, paddleFlash[1] - dt / 1.2); p2FaceMat.opacity = 0.35 + paddleFlash[1] * 0.55; }
  if (missFlash[0] > 0) { missFlash[0] = Math.max(0, missFlash[0] - dt / 1.8); miss1.fillMat.opacity = missFlash[0] * 0.18; miss1.rimMat.opacity = missFlash[0] * 0.7; }
  if (missFlash[1] > 0) { missFlash[1] = Math.max(0, missFlash[1] - dt / 1.8); miss2.fillMat.opacity = missFlash[1] * 0.18; miss2.rimMat.opacity = missFlash[1] * 0.7; }
  for (const r of bounceRings) {
    if (r.flash > 0) { r.flash = Math.max(0, r.flash - dt / 0.4); r.fillMat.opacity = r.flash * 0.18; r.rimMat.opacity = r.flash * 0.7; }
  }
  pushTrail(ball.pos);

  ballMesh.position.copy(ball.pos);

  // Paddles face inward (toward arena centre along z)
  paddle1.position.set(p1.x, p1.y, PADDLE_INSET);
  paddle1.rotation.set(0, 0, 0);          // face +z

  paddle2.position.set(p2.x, p2.y, AD - PADDLE_INSET);
  paddle2.rotation.set(0, Math.PI, 0);    // face -z

  if (camAnimTime >= 0) {
    camAnimTime = Math.min(camAnimTime + dt, CAM_ANIM_DURATION);
    const t    = camAnimTime / CAM_ANIM_DURATION;
    const ease = t * t * (3 - 2 * t);
    camera.position.lerpVectors(_camFrom, _camTo, ease);
    controls.target.lerpVectors(_camFromT, _camToT, ease);
    camera.lookAt(controls.target);
    if (camAnimTime >= CAM_ANIM_DURATION) {
      camAnimTime = -1;
      camera.position.copy(_camTo);
      controls.target.copy(_camToT);
      controls.enabled = true;
      controls.update();
      if (_camOnDone) { _camOnDone(); _camOnDone = null; }
    }
  } else if (!renderer.xr.isPresenting) {
    controls.update();
  }
  renderer.render(scene, camera);
});
</script>
