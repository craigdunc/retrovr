<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DuelVR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0b0b14; overflow: hidden; }
    @keyframes blink { 50% { opacity: 0; } }
    #attract {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      pointer-events: none; opacity: 0; transition: opacity 0.6s;
    }
    #attract.visible { opacity: 1; }
    #attract-logo  { width: 52%; max-width: 680px; }
    #attract-start { width: 18%; max-width: 240px; margin-top: 3.5vh;
                     animation: blink 1.2s step-end infinite; }
    #gameover {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      pointer-events: none; opacity: 0; transition: opacity 0.5s;
    }
    #gameover.visible { opacity: 1; }
    #winner {
      color: #fff; font-family: 'Courier New', monospace; font-size: 52px;
      font-weight: bold; letter-spacing: 0.2em;
    }
    #gameover-start {
      color: #aaa; font-family: 'Courier New', monospace; font-size: 14px;
      margin-top: 24px; letter-spacing: 0.15em; animation: blink 1.2s step-end infinite;
    }
    #score {
      position: absolute; top: 20px; left: 0; width: 100%; text-align: center;
      color: #fff; font-family: 'Courier New', monospace; font-size: 48px;
      font-weight: bold; letter-spacing: 0.15em; pointer-events: none;
      opacity: 0; transition: opacity 0.4s;
    }
    #score.visible { opacity: 1; }
    #score-p1, #score-p2 { color: #fff; }
    .score-pip { display: inline-block; width: 11px; height: 11px; vertical-align: top; margin-top: 7px; margin-right: 6px; }
    .score-pip.p1 { background: #44aaff; }
    .score-pip.p2 { background: #ff4466; }
    #level-banner {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      pointer-events: none; opacity: 0; transition: opacity 0.45s;
    }
    #level-banner.visible { opacity: 1; }
    #level-text { color: #fff; font-family: 'Courier New', monospace; font-size: 68px; font-weight: bold; letter-spacing: 0.2em; }
    #level-sub  { color: #666; font-family: 'Courier New', monospace; font-size: 15px; letter-spacing: 0.22em; margin-top: 14px; }
  </style>
</head>
<body>
<div id="score"><span id="score-p1"><span class="score-pip p1"></span>0</span>&nbsp;&nbsp;&nbsp;<span id="score-p2"><span class="score-pip p2"></span>0</span></div>
<div id="attract">
  <img id="attract-logo"  src="DuelVR.png" alt="TennisVR">
  <img id="attract-start" src="Start.png"    alt="START">
</div>
<div id="gameover">
  <div id="winner">P1 WINS</div>
  <div id="gameover-start">PRESS ANY KEY TO PLAY AGAIN</div>
</div>
<div id="level-banner">
  <div id="level-text">LEVEL 1</div>
  <div id="level-sub">RIGHT HAND ONLY</div>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Renderer ──────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);

// VR + AR buttons
let isARSession = false;
(async () => {
  function makeBtn(label, offsetX) {
    const b = document.createElement('button');
    b.style.cssText = `position:absolute;bottom:20px;left:calc(50% + ${offsetX}px);width:100px;` +
      'padding:12px 6px;background:rgba(0,0,0,0.1);color:#fff;font-family:sans-serif;' +
      'font-size:13px;border:1px solid #fff;z-index:999;cursor:pointer;opacity:0.5;';
    b.textContent = label;
    document.body.appendChild(b);
    b.addEventListener('mouseenter', () => { b.style.opacity = '1'; });
    b.addEventListener('mouseleave', () => { b.style.opacity = '0.5'; });
    return b;
  }
  const vrBtn = makeBtn('ENTER VR', -110);
  const arBtn = makeBtn('ENTER AR',   10);
  if (!('xr' in navigator)) { vrBtn.textContent = 'NO WEBXR'; arBtn.textContent = 'NO WEBXR'; return; }
  const [vrOk, arOk] = await Promise.all([
    navigator.xr.isSessionSupported('immersive-vr').catch(() => false),
    navigator.xr.isSessionSupported('immersive-ar').catch(() => false),
  ]);
  vrBtn.textContent = vrOk ? 'ENTER VR' : 'VR N/A';
  arBtn.textContent = arOk ? 'ENTER AR' : 'AR N/A';
  let xrCurrentSession = null;
  async function enterXR(type, btn) {
    if (xrCurrentSession) { xrCurrentSession.end(); return; }
    try {
      const session = await navigator.xr.requestSession(type, { requiredFeatures: ['local-floor'] });
      await renderer.xr.setSession(session);
      isARSession = type === 'immersive-ar';
      scene.background = isARSession ? null : sceneBg;
      gridHelper.visible = !isARSession;
      btn.textContent = isARSession ? 'EXIT AR' : 'EXIT VR';
      xrCurrentSession = session;
      session.addEventListener('end', () => {
        xrCurrentSession = null; isARSession = false;
        scene.background = sceneBg; gridHelper.visible = true;
        btn.textContent = type === 'immersive-vr' ? 'ENTER VR' : 'ENTER AR';
      });
    } catch (e) {
      btn.textContent = e.name || 'ERROR';
      setTimeout(() => { btn.textContent = type === 'immersive-vr' ? 'ENTER VR' : 'ENTER AR'; }, 3000);
    }
  }
  vrBtn.addEventListener('click', () => enterXR('immersive-vr', vrBtn));
  vrBtn.addEventListener('touchend', e => { e.preventDefault(); enterXR('immersive-vr', vrBtn); });
  arBtn.addEventListener('click', () => enterXR('immersive-ar', arBtn));
  arBtn.addEventListener('touchend', e => { e.preventDefault(); enterXR('immersive-ar', arBtn); });
})();

const scene = new THREE.Scene();
const sceneBg = new THREE.Color(0x0b0b14);
scene.background = sceneBg;

const arenaRoot = new THREE.Group();
scene.add(arenaRoot);

// ── Arena constants ───────────────────────────────────────────────────────────
const AW = 1.525;
const AH = 0.762;
const AD = 4.5;
const AY = 0.76;
const BALL_R       = 0.030;
const PADDLE_R     = 0.022;
const COIN_R       = 0.010;   // tiny coin-puck radius when hand is past front plane
const PADDLE_INSET = 1.28; // just in front of avatar (BRICK_Z1=1.2)
const SHOULDER_X   = 0.087; // lateral offset from avatar centre to each paddle (outer arm brick)
const TILT_Z_BACK  = 0.20;              // hand depth ahead of head (m) = full vertical paddle
const TILT_Z_FRONT = 0.24;              // hand depth ahead of head (m) = full horizontal coin + laser
const P1_SENS      = 1.8;
const P1_VR_SENS   = 0.25;  // VR game frisbee sensitivity
const REAL_HAND_R  = 0.10;  // real-world hand ring radius (~palm size)
const SHOOT_SPEED  = 4.5;               // m/s — powerful but controllable
const RETURN_SPEED = SHOOT_SPEED * 2;   // m/s — Thor's hammer return
const STEER_FORCE  = 2.5;               // aftertouch swerve — m/s² per m/s of hand speed
const P1_MAP_S     = 0.25;             // hand→paddle scale: arena walls map to debug box edges
const P1_MAP_FLOOR = AY + 0.4;         // arena floor in XR/world Y (AY + ARENA_FULL_POS.y)
const ARENA_CY     = AY + AH * 0.5;

// Bricks: 5 per side, at back of each player's half
const BRICK_COUNT = 5;
const BRICK_W = (AW / 2) / BRICK_COUNT;  // kept for legacy bounds use
const BRICK_H = 0.12;
const BRICK_SCALE = 0.60;
// Per-brick [w, h] — avatar arm-spread pose (idx 0=outer-left … 4=outer-right)
// dy = Y offset from BRICK_Y (outer bricks hang below arm line, tops aligned)
const BRICK_CONFIGS = [
  { w: 0.032, h: 0.083, dy: -0.014 },  // outer (arm — hangs below)
  { w: 0.032, h: 0.054, dy:  0     },  // inner (shoulder)
  { w: 0.078, h: 0.054, dy:  0     },  // centre (chest / life brick)
  { w: 0.032, h: 0.054, dy:  0     },  // inner (shoulder)
  { w: 0.032, h: 0.083, dy: -0.014 },  // outer (arm — hangs below)
];
const BRICK_D = 0.08;           // thick enough to prevent tunnelling at max speed
const BRICK_Y = AY + 0.181;    // torso base sits on arena floor
const P1_MAP_TOP_Y = BRICK_Y + 0.097;  // paddle Y when hand at head height (= debug box top)
const BRICK_Z1 = 1.2;        // P1's bricks 1.2m into arena
const BRICK_Z2 = AD - 1.2;   // P2's bricks 1.2m into arena from far wall

const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.01, 60);
camera.position.set(2.6, 3.4, -0.7);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, AY + AH / 2, AD / 2);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 0.8;
controls.maxDistance = 10;
controls.update();

// ── Desktop camera animation ──────────────────────────────────────────────────
const CAM_INTRO_POS    = new THREE.Vector3(2.6, 3.4, -0.7);
const CAM_INTRO_TARGET = new THREE.Vector3(0, AY + AH / 2, AD / 2);
const CAM_GAME_POS     = new THREE.Vector3(0, AY + AH * 0.5, -0.5);
const CAM_GAME_TARGET  = new THREE.Vector3(0, AY + AH * 0.45, AD * 0.35);
const CAM_ANIM_DURATION = 1.5;
let camAnimTime = -1;
let camAtGame   = false;
let gameState   = 'attract';

const _camFrom = new THREE.Vector3(), _camFromT = new THREE.Vector3();
const _camTo   = new THREE.Vector3(), _camToT   = new THREE.Vector3();
let _camOnDone = null;

function startCamAnim(fromPos, fromTgt, toPos, toTgt, onDone) {
  _camFrom.copy(fromPos); _camFromT.copy(fromTgt);
  _camTo.copy(toPos);     _camToT.copy(toTgt);
  camAnimTime = 0; _camOnDone = onDone || null;
  controls.enabled = false;
}

// ── VR arena animation ────────────────────────────────────────────────────────
const ARENA_MINI_POS    = new THREE.Vector3(0, 0.75, 0.6);
const ARENA_MINI_SCALE  = 0.18;
const ARENA_MINI_ROT_Y  = Math.PI / 4;
const ARENA_FULL_POS    = new THREE.Vector3(0, 0.4, -0.8);
const ARENA_FULL_SCALE  = 1.0;
const ARENA_FULL_ROT_Y  = 0;
const ARENA_ANIM_DURATION = 1.5;
let arenaAnimTime = -1, arenaAnimFromSc = 1, arenaAnimToSc = 1;
let arenaAnimFromRot = 0, arenaAnimToRot = 0;
const _arenaFromPos = new THREE.Vector3(), _arenaToPos = new THREE.Vector3();
let _arenaOnDone = null;

function startArenaAnim(fromPos, fromSc, fromRotY, toPos, toSc, toRotY, onDone) {
  _arenaFromPos.copy(fromPos); arenaAnimFromSc = fromSc; arenaAnimFromRot = fromRotY;
  _arenaToPos.copy(toPos);     arenaAnimToSc   = toSc;   arenaAnimToRot   = toRotY;
  arenaAnimTime = 0; _arenaOnDone = onDone || null;
}

// ── Arena geometry ────────────────────────────────────────────────────────────
function addTableFace(y, normalUp) {
  const surf = new THREE.Mesh(
    new THREE.PlaneGeometry(AW, AD),
    new THREE.MeshBasicMaterial({ color: 0x071428, transparent: true, opacity: 0.45, side: THREE.DoubleSide })
  );
  surf.rotation.x = -Math.PI / 2;
  surf.position.set(0, y, AD / 2);
  arenaRoot.add(surf);
  const LH = 0.002, LW = 0.012;
  const ly = y + (normalUp ? LH / 2 : -LH / 2);
  const wm = new THREE.MeshBasicMaterial({ color: 0x1a66cc });
  const addLine = (w, d, x, z) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, LH, d), wm);
    m.position.set(x, ly, z); arenaRoot.add(m);
  };
  addLine(LW, AD + LW, -AW / 2, AD / 2); addLine(LW, AD + LW, AW / 2, AD / 2);
  addLine(AW + LW, LW, 0, 0);  addLine(AW + LW, LW, 0, AD);
}
addTableFace(AY, true);
addTableFace(AY + AH, false);

function addSideWall(x) {
  const sign = x > 0 ? 1 : -1;
  const geo  = new THREE.PlaneGeometry(AD, AH);
  const fill = new THREE.Mesh(geo,
    new THREE.MeshBasicMaterial({ color: 0x071428, transparent: true, opacity: 0.45, side: THREE.DoubleSide })
  );
  fill.rotation.y = -sign * Math.PI / 2;
  fill.position.set(x, AY + AH / 2, AD / 2);
  arenaRoot.add(fill);
  const edgeLines = new THREE.LineSegments(
    new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({ color: 0x1a66cc })
  );
  edgeLines.rotation.y = -sign * Math.PI / 2;
  edgeLines.position.set(x, AY + AH / 2, AD / 2);
  arenaRoot.add(edgeLines);
}
addSideWall(-AW / 2);
addSideWall( AW / 2);

// Floor rings — decorative concentric circles at each player's position
{
  const y = AY + 0.003;
  const radii = [0.15, 0.28, 0.42, 0.56];
  for (const [centerZ, color] of [[BRICK_Z1, 0x2266cc], [BRICK_Z2, 0x2266cc]]) {
    const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.40, depthWrite: false });
    for (const r of radii) {
      const ring = new THREE.Mesh(new THREE.TorusGeometry(r, 0.004, 6, 64), mat);
      ring.rotation.x = -Math.PI / 2;
      ring.position.set(0, y, centerZ);
      arenaRoot.add(ring);
    }
  }
}

// End-wall flash (repurposed: flashes when a brick is hit on that side)
const p1WallMat = new THREE.MeshBasicMaterial({ color: 0x3377dd, transparent: true, opacity: 0, side: THREE.DoubleSide });
const p2WallMat = new THREE.MeshBasicMaterial({ color: 0xdd3355, transparent: true, opacity: 0, side: THREE.DoubleSide });
const wallFlash = [0, 0];
{
  const geo = new THREE.PlaneGeometry(AW, AH);
  const w1  = new THREE.Mesh(geo, p1WallMat); w1.position.set(0, AY + AH / 2, 0); arenaRoot.add(w1);
  const w2  = new THREE.Mesh(geo, p2WallMat); w2.position.set(0, AY + AH / 2, AD); arenaRoot.add(w2);
}

const gridHelper = new THREE.GridHelper(12, 30, 0x141420, 0x111118);
scene.add(gridHelper);

// ── Ball factory (one mesh + trail per ball) ──────────────────────────────────
const TRAIL = 22;
const _glowTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.3, 'rgba(255,255,255,0.5)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
})();

function makeBallObject(glowColor = 0xffffff) {
  const ballMat  = new THREE.MeshBasicMaterial({ color: 0xd8dde8, transparent: true, opacity: 0.60, side: THREE.DoubleSide, depthWrite: false });
  const mesh     = new THREE.Mesh(new THREE.CircleGeometry(BALL_R, 40), ballMat);
  mesh.rotation.x = -Math.PI / 2;
  const ringMat = new THREE.MeshBasicMaterial({ color: glowColor, transparent: true, opacity: 1.0 });
  for (const rf of [0.25, 0.50, 0.75, 1.0]) {
    const r = new THREE.Mesh(new THREE.TorusGeometry(BALL_R * rf, rf === 1.0 ? 0.005 : 0.003, 8, 32), ringMat);
    mesh.add(r);
  }
  const glowMat  = new THREE.SpriteMaterial({ map: _glowTex, color: glowColor, transparent: true, depthWrite: false });
  const sprite   = new THREE.Sprite(glowMat);
  sprite.scale.set(0.45, 0.45, 1); mesh.add(sprite);
  mesh.visible = false; arenaRoot.add(mesh);
  const tMats   = Array.from({ length: TRAIL }, (_, i) =>
    new THREE.MeshBasicMaterial({ color: glowColor, transparent: true, opacity: (1 - i / TRAIL) * 0.32, depthWrite: false })
  );
  const tMeshes = Array.from({ length: TRAIL }, (_, i) => {
    tMats[i].side = THREE.DoubleSide;
    const m = new THREE.Mesh(new THREE.CircleGeometry(BALL_R * (1 - i / TRAIL) * 0.7, 10), tMats[i]);
    m.rotation.x = -Math.PI / 2;
    arenaRoot.add(m); return m;
  });
  const tBuf = Array.from({ length: TRAIL }, () => new THREE.Vector3(-99, 0, 0));
  let tHead = 0;
  return {
    pos: new THREE.Vector3(), vel: new THREE.Vector3(),
    state: 'idle', shooter: null, shooterPaddle: null, shooterZ: PADDLE_INSET, flyTime: 0,
    mesh,
    setFade(v) {
      ballMat.transparent = v < 1; ballMat.opacity = v;
      ringMat.transparent = v < 1; ringMat.opacity = v;
      glowMat.opacity = v;
      for (let i = 0; i < TRAIL; i++) tMats[i].opacity = v * (1 - i / TRAIL) * 0.32;
    },
    pushTrail(pos) {
      tBuf[tHead].copy(pos); tHead = (tHead + 1) % TRAIL;
      for (let i = 0; i < TRAIL; i++) tMeshes[i].position.copy(tBuf[(tHead + TRAIL - 1 - i) % TRAIL]);
    },
    clearTrail() {
      for (let i = 0; i < TRAIL; i++) { tBuf[i].set(-99, 0, 0); tMeshes[i].position.set(-99, 0, 0); }
    }
  };
}

// ── Paddles — two per side ────────────────────────────────────────────────────
function makePaddle(faceColor, rimColor) {
  const g = new THREE.Group();
  const greyMat = new THREE.MeshBasicMaterial({ color: 0xd0d8e8, transparent: true, opacity: 0.38, side: THREE.DoubleSide, depthWrite: false });
  const face = new THREE.Mesh(new THREE.CircleGeometry(PADDLE_R, 40), greyMat);
  face.position.y = PADDLE_R;
  g.add(face);
  const faceMat = new THREE.MeshBasicMaterial({ color: rimColor, transparent: true, opacity: 1.0, depthWrite: false });
  for (const [rf, thick] of [[0.30, 0.0016], [0.60, 0.0016], [0.85, 0.0016], [1.0, 0.0026]]) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(PADDLE_R * rf, thick, 8, 48), faceMat);
    ring.position.y = PADDLE_R;
    g.add(ring);
  }
  return { group: g, faceMat };
}
const { group: paddle1,  faceMat: p1FaceMat  } = makePaddle(0x3377dd, 0x88bbff);
const { group: paddle1b, faceMat: p1bFaceMat } = makePaddle(0x22aacc, 0x66ddff);
const _whiteColor  = new THREE.Color(0xffffff);
const _p1BaseColor  = new THREE.Color(0x88bbff);
const _p1bBaseColor = new THREE.Color(0x66ddff);
const _p2BaseColor  = new THREE.Color(0xff88aa);
const _p2bBaseColor = new THREE.Color(0xffbb66);
const { group: paddle2,  faceMat: p2FaceMat  } = makePaddle(0xdd3355, 0xff88aa);
const { group: paddle2b, faceMat: p2bFaceMat } = makePaddle(0xdd7722, 0xffbb66);



// Real-scale hand indicators — track actual VR hand position 1:1, no game mechanics
function makeRealHandRing(color) {
  const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.80, depthWrite: false, depthTest: false });
  const torus = new THREE.Mesh(new THREE.TorusGeometry(REAL_HAND_R, 0.003, 8, 48), mat);
  torus.position.y = REAL_HAND_R;
  torus.renderOrder = 10;
  const g = new THREE.Group(); g.add(torus); g.visible = false;
  scene.add(g); return g;
}
const realHand1  = makeRealHandRing(0x88bbff);
const realHand1b = makeRealHandRing(0x66ddff);

arenaRoot.add(paddle1, paddle1b, paddle2, paddle2b);
const paddleFlash = [0, 0, 0, 0];

// ── Laser pointers (targetRay-based, world space, visible past front tilt plane) ─
const _laserQ   = new THREE.Quaternion();
const _laserDir = new THREE.Vector3();
function makeLaserRay(color) {
  const buf  = new Float32Array(6); // start (xyz) + end (xyz)
  const geo  = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(buf, 3));
  const mat  = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.8, depthWrite: false });
  const line = new THREE.Line(geo, mat);
  line.visible = false;
  scene.add(line);
  return { line, buf };
}
const laser1  = makeLaserRay(0x88bbff);
const laser1b = makeLaserRay(0x66ddff);
const p1LaserOrigin  = new THREE.Vector3();
const p1LaserDir     = new THREE.Vector3();
const p1bLaserOrigin = new THREE.Vector3();
const p1bLaserDir    = new THREE.Vector3();

// ── Bricks ────────────────────────────────────────────────────────────────────
function makeBricks(brickZ, fillColor, edgeColor) {
  // Compute touching centre X positions, packing outward from idx 2 (centre)
  const xs = new Array(BRICK_COUNT);
  xs[2] = 0;
  for (let i = 1; i >= 0; i--)
    xs[i] = xs[i + 1] - BRICK_CONFIGS[i + 1].w / 2 - BRICK_CONFIGS[i].w / 2;
  for (let i = 3; i < BRICK_COUNT; i++)
    xs[i] = -xs[BRICK_COUNT - 1 - i];

  return Array.from({ length: BRICK_COUNT }, (_, i) => {
    const { w, h, dy } = BRICK_CONFIGS[i];
    const localX = xs[i];
    const localY = BRICK_Y + dy;
    const geo     = new THREE.BoxGeometry(w, h, BRICK_D);
    const fillMat = new THREE.MeshBasicMaterial({ color: fillColor, transparent: true, opacity: 0.18 });
    const edgeMat = new THREE.LineBasicMaterial({ color: edgeColor, transparent: true, opacity: 1 });
    const mesh  = new THREE.Mesh(geo, fillMat);
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo), edgeMat);
    mesh.position.set(localX, localY, brickZ);
    edges.position.set(localX, localY, brickZ);
    arenaRoot.add(mesh, edges);
    return { localX, x: localX, y: localY, w, h, mesh, edges, fillMat, edgeMat, alive: true, state: 'normal' };
  });
}

// Non-destructible avatar body parts: head (above chest) + torso (below chest)
const AVATAR_BODY_PARTS = [
  { localX: 0, localY: BRICK_Y + 0.070, w: 0.078, h: 0.054 },  // head
  { localX: 0, localY: BRICK_Y - 0.104, w: 0.078, h: 0.154 },  // torso/legs
];
function makeAvatarBody(brickZ, fillColor, edgeColor) {
  return AVATAR_BODY_PARTS.map(({ localX, localY, w, h }) => {
    const geo     = new THREE.BoxGeometry(w, h, BRICK_D);
    const fillMat = new THREE.MeshBasicMaterial({ color: fillColor, transparent: true, opacity: 0.18 });
    const edgeMat = new THREE.LineBasicMaterial({ color: edgeColor, transparent: true, opacity: 1 });
    const mesh  = new THREE.Mesh(geo, fillMat);
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo), edgeMat);
    mesh.position.set(localX, localY, brickZ);
    edges.position.set(localX, localY, brickZ);
    arenaRoot.add(mesh, edges);
    return { localX, localY, w, h, mesh, edges, fillMat, edgeMat, state: 'normal' };

function updateBrickGroupX(side, targetX) {
  const bricks = side === 0 ? p1Bricks : p2Bricks;
  let leftIdx = BRICK_COUNT, rightIdx = -1;
  for (let i = 0; i < BRICK_COUNT; i++) {
    if (bricks[i].alive) {
      if (i < leftIdx) leftIdx = i;
      if (i > rightIdx) rightIdx = i;
    }
  }
  if (rightIdx < 0) { brickGroupX[side] = targetX; return; }
  const leftLocalX  = bricks[leftIdx].localX;
  const rightLocalX = bricks[rightIdx].localX;
  const minX = -AW / 2 - leftLocalX  + bricks[leftIdx].w  / 2;
  const maxX =  AW / 2 - rightLocalX - bricks[rightIdx].w / 2;
  brickGroupX[side] = Math.max(minX, Math.min(maxX, targetX));
  for (let i = 0; i < BRICK_COUNT; i++) {
    const wx = brickGroupX[side] + bricks[i].localX;
    bricks[i].x = wx; bricks[i].mesh.position.x = wx; bricks[i].edges.position.x = wx;
  }
  for (const bp of (side === 0 ? p1Body : p2Body)) {
    const wx = brickGroupX[side] + bp.localX;
    bp.mesh.position.x = wx; bp.edges.position.x = wx;
  }
  if (side === 0 && _debugBoxLine) _debugBoxLine.position.x = brickGroupX[0];
  updateVRBricks();
}

let _debrisHead = 0;

function _spawnDebrisAt(wx, wy, wz, color, cxw, cyw, czw, count) {
  for (let k = 0; k < count; k++) {
    const d = _debrisParticles[_debrisHead++ % DEBRIS_POOL];
    d.mesh.position.set(
      wx + (Math.random() - 0.5) * 0.04,
      wy + (Math.random() - 0.5) * 0.04,
      wz + (Math.random() - 0.5) * 0.04
    );
    const dx = wx - cxw, dy = wy - cyw, dz = wz - czw;
    const len = Math.sqrt(dx*dx + dy*dy + dz*dz) + 0.001;
    const spd = 1.0 + Math.random() * 1.8;
    d.vel.set(
      (dx/len + (Math.random()-0.5)*0.7) * spd,
      (dy/len + Math.random()*0.3)       * spd,
      (dz/len + (Math.random()-0.5)*0.7) * spd
    );
    d.rotVel.set(
      (Math.random()-0.5)*12, (Math.random()-0.5)*12, (Math.random()-0.5)*12
    );
    d.mat.color.setHex(color);
    d.mat.opacity = 1.0;
    d.mesh.visible = true;
    d.life = 0;
    d.maxLife = 1.4 + Math.random() * 0.8;
    d.riseDelay = 0.2 + Math.random() * 0.35;
  }
}

function spawnDeathDebris(sideIdx, centreBrick) {
  const bricks = sideIdx === 0 ? p1Bricks : p2Bricks;
  const body   = sideIdx === 0 ? p1Body   : p2Body;
  const color  = sideIdx === 0 ? 0x44aaff : 0xff4466;
  const wp = new THREE.Vector3(), ctrWP = new THREE.Vector3();
  body[0].mesh.getWorldPosition(ctrWP);
  const cxw = ctrWP.x, cyw = ctrWP.y, czw = ctrWP.z;
  centreBrick.mesh.getWorldPosition(wp);
  _spawnDebrisAt(wp.x, wp.y, wp.z, color, cxw, cyw, czw, 14);
  for (const br of bricks) {
    if (!br.alive) continue;
    br.mesh.getWorldPosition(wp);
    _spawnDebrisAt(wp.x, wp.y, wp.z, color, cxw, cyw, czw, 8);
  }
  for (const bp of body) {
    bp.mesh.getWorldPosition(wp);
    _spawnDebrisAt(wp.x, wp.y, wp.z, color, cxw, cyw, czw, 8);
  }
}

function updateDebris(dt) {
  for (const d of _debrisParticles) {
    if (!d.mesh.visible) continue;
    d.life += dt;
    if (d.life >= d.maxLife) { d.mesh.visible = false; d.mat.opacity = 0; continue; }
    if (d.life < d.riseDelay) {
      d.vel.multiplyScalar(1 - dt * 2.0);
      d.mesh.position.addScaledVector(d.vel, dt);
    } else {
      d.vel.x *= (1 - dt * 5); d.vel.z *= (1 - dt * 5);
      d.vel.y += dt * 1.8;
      d.mesh.position.addScaledVector(d.vel, dt);
      const rT = (d.life - d.riseDelay) / (d.maxLife - d.riseDelay);
      d.mat.opacity = Math.max(0, 1.0 - rT);
    }
    d.mesh.rotation.x += d.rotVel.x * dt;
    d.mesh.rotation.y += d.rotVel.y * dt;
    d.mesh.rotation.z += d.rotVel.z * dt;
  }
}

// ── Angular deflection ────────────────────────────────────────────────────────
const MAX_DEFLECT = 55 * Math.PI / 180;
const HIT_SPEEDUP = 1.055;
const MAX_SPEED   = 6.0;

function applyPaddleHit(paddleX, paddleY, newZSign, paddleIdx) {
  paddleFlash[paddleIdx] = 1.0;
  const dx = ball.pos.x - paddleX, dy = ball.pos.y - paddleY;
  const hitDist = Math.sqrt(dx * dx + dy * dy);
  const norm  = Math.min(hitDist / PADDLE_R, 1.0);
  const spd   = Math.min(ball.vel.length() * HIT_SPEEDUP, MAX_SPEED);
  const angle = norm * MAX_DEFLECT;
  const fwd = Math.cos(angle), lat = Math.sin(angle);
  const latX = hitDist > 0.001 ? dx / hitDist : 0;
  const latY = hitDist > 0.001 ? dy / hitDist : 0;
  ball.vel.set(latX * lat * spd, latY * lat * spd, newZSign * fwd * spd);
  soundPaddle();
}

// ── Mouse → P1 (desktop) ──────────────────────────────────────────────────────

const mouse2    = new THREE.Vector2();
const p1Plane   = new THREE.Plane(new THREE.Vector3(0, 0, 1), -PADDLE_INSET);

// ── CPU P2 ────────────────────────────────────────────────────────────────────
const CPU_SPEED = 1.5;
const CPU_ERROR = 0.040;
const DEFENSIVE_SPREAD = SHOULDER_X;   // match P1 shoulder offset
const P2_MAP_HW = AW * P1_MAP_S / 2;  // half-width of P2 paddle range (same as P1 debug box)
let cpuOff = { x: 0, y: 0 }, cpuOff2 = { x: 0, y: 0 };

function resetCpuOff() {
  const a1 = Math.random() * Math.PI * 2, r1 = CPU_ERROR * (0.5 + Math.random() * 0.5);
  cpuOff.x  = Math.cos(a1) * r1; cpuOff.y  = Math.sin(a1) * r1;
  const a2 = Math.random() * Math.PI * 2, r2 = CPU_ERROR * (0.5 + Math.random() * 0.5);
  cpuOff2.x = Math.cos(a2) * r2; cpuOff2.y = Math.sin(a2) * r2;
}
resetCpuOff();

function cpuMoveToward(paddle, tx, ty, dt) {
  if (paddle.deleted) return;
  const dx = tx - paddle.x, dy = ty - paddle.y;
  const d = Math.sqrt(dx * dx + dy * dy);
  if (d > 0.001) { const spd = CPU_SPEED * (paddle.speedMult || 1.0) * dt; paddle.x += dx / d * Math.min(d, spd); paddle.y += dy / d * Math.min(d, spd); }
}

function clampP2Paddle(paddle, centerX, shoulderOff) {
  // Constrain P2 paddles to a tight area around the avatar, matching P1's debug box
  paddle.x = THREE.MathUtils.clamp(paddle.x, centerX + shoulderOff - P2_MAP_HW, centerX + shoulderOff + P2_MAP_HW);
  paddle.y = THREE.MathUtils.clamp(paddle.y, AY, PADDLE_Y_MAX);
}

function updateCpu(dt) {
  const ref = balls[0]; // placeholder until CPU gets its own shoot mechanic
  const midY = AY + AH * 0.5;
  // Simulated head = midpoint of hands (single-hand in level 1)
  const headX = currentLevel === 1 ? p2.x : (p2.x + p2b.x) / 2;
  if (ref.vel.z <= 0) {
    cpuMoveToward(p2,  headX + SHOULDER_X,  midY, dt);
    cpuMoveToward(p2b, headX - SHOULDER_X,  midY, dt);
  } else {
    cpuMoveToward(p2,  ref.pos.x + cpuOff.x,  ref.pos.y + cpuOff.y,  dt);
    cpuMoveToward(p2b, ref.pos.x + cpuOff2.x, ref.pos.y + cpuOff2.y, dt);
  }
  clampP2Paddle(p2,  brickGroupX[1],  SHOULDER_X);
  clampP2Paddle(p2b, brickGroupX[1], -SHOULDER_X);
  updateBrickGroupX(1, currentLevel === 1 ? p2.x : (p2.x + p2b.x) / 2);
}

// ── CPU shooting ─────────────────────────────────────────────────────────────
const CPU_SHOOT_MIN  = 3.0;
const CPU_SHOOT_MAX  = 5.0;
const CPU_CHARGE_WIN = 0.5;  // visual charge window before fire (s)
const _cpuShootState2  = { timer: 5.0 };
const _cpuShootState2b = { timer: 5.5 };
const _cpuShootDir = new THREE.Vector3();

function _cpuDoShoot(paddle, ball, group, state, dt) {
  if (paddle.deleted) return;
  if (ball.state !== 'idle') {
    paddle.targetTilt = 0; paddle.targetBrightness = 0; paddle.targetScale = 1;
    return;
  }
  state.timer -= dt;
  const charge = THREE.MathUtils.clamp(1 - state.timer / CPU_CHARGE_WIN, 0, 1);
  paddle.targetTilt       = charge * (Math.PI / 2);
  paddle.targetBrightness = charge;
  paddle.targetScale      = 1;
  if (state.timer <= 0) {
    const alive = p1Bricks.filter(br => br.alive);
    if (alive.length > 0) {
      const target = alive[Math.floor(Math.random() * alive.length)];
      _cpuShootDir.set(target.x - paddle.x, target.y - paddle.y, BRICK_Z1 - (AD - PADDLE_INSET)).normalize();
      shootBall(ball, paddle, group, _cpuShootDir, AD - PADDLE_INSET);
    }
    state.timer = CPU_SHOOT_MIN + Math.random() * (CPU_SHOOT_MAX - CPU_SHOOT_MIN);
    paddle.targetTilt = 0; paddle.targetBrightness = 0; paddle.targetScale = 1;
  }
}

function updateCpuShooting(dt) {
  if (gameState !== 'playing') return;
  _cpuDoShoot(p2,  balls[2], paddle2,  _cpuShootState2,  dt);
  if (currentLevel !== 1) _cpuDoShoot(p2b, balls[3], paddle2b, _cpuShootState2b, dt);
}

// ── WebXR ─────────────────────────────────────────────────────────────────────

const grip1 = renderer.xr.getControllerGrip(0);
const grip2 = renderer.xr.getControllerGrip(1);
scene.add(grip1, grip2);

function updateXRPaddles(frame, dt) {
  if (!xrSession || !frame) return;
  const rs = renderer.xr.getReferenceSpace();
  if (!rs) return;
  // Use viewer pose so headZ is in the same reference space as hand/grip poses
  const viewerPose = frame.getViewerPose(rs);
  if (!viewerPose) return;
  const headX = viewerPose.transform.position.x;
  const headY = viewerPose.transform.position.y;
  const headZ = viewerPose.transform.position.z;
  let handledRight = false, handledLeft = false;
  for (const src of xrSession.inputSources) {
    const isRight = src.handedness === 'right', isLeft = src.handedness === 'left';
    if (!isRight && !isLeft) continue;
    // Hand tracking takes priority: skip controller source if hand already updated this side
    if (!src.hand && ((isRight && handledRight) || (isLeft && handledLeft))) continue;
    let wx, wy, wz;
    if (src.hand) {
      const wrist = src.hand.get('wrist');
      if (wrist) {
        const pose = frame.getJointPose(wrist, rs);
        if (pose) { wx = pose.transform.position.x; wy = pose.transform.position.y; wz = pose.transform.position.z; }
      }
    } else if (src.gripSpace) {
      const pose = frame.getPose(src.gripSpace, rs);
      if (pose) { wx = pose.transform.position.x; wy = pose.transform.position.y; wz = pose.transform.position.z; }
    }
    if (wx === undefined) continue;
    const target = isRight ? p1 : p1b;

    // Hand velocity tracking — pull (Z back) and lateral steering (X, Y)
    if (dt > 0) {
      target.pullRate = Math.max(0, (target.prevWz - wz) / dt);
      target.xRate    = (wx - target.prevWx) / dt;
      target.yRate    = (wy - target.prevWy) / dt;
    }
    target.prevWz = wz; target.prevWx = wx; target.prevWy = wy;

    const depth = wz - headZ;
    let t, rawT;
    if (src.hand) {
      rawT = (depth - TILT_Z_BACK) / (TILT_Z_FRONT - TILT_Z_BACK);
      t = THREE.MathUtils.clamp(rawT, 0, 1);
      if (isRight) handledRight = true; else handledLeft = true;
    } else {
      const tDepth   = THREE.MathUtils.clamp((depth - TILT_Z_BACK) / (TILT_Z_FRONT - TILT_Z_BACK), 0, 1);
      const tTrigger = src.gamepad?.buttons[0]?.value ?? 0;
      t = Math.max(tDepth, tTrigger);
      rawT = t;
    }

    // Snap: deliberate retraction — hand must be 15cm BEHIND head, not just behind rest position
    if (t > 0.2) target.handWasOut = true;
    if (depth < -0.15 && target.handWasOut) {
      target.handWasOut = false;
      const ballIdx = target === p1 ? 0 : 1;
      const bd = balls[ballIdx];
      if (bd.state === 'flying' && bd.shooter === target) {
        bd.state = 'idle'; bd.mesh.visible = false; bd.clearTrail();
        if (bd.shooterPaddle) { bd.shooterPaddle.visible = true; bd.shooterPaddle = null; }
        soundPaddle();
      }
    }

    if (target.deleted) {
      (isRight ? laser1 : laser1b).line.visible = false;
      (isRight ? realHand1 : realHand1b).visible = false;
      continue;
    }
    target.targetX          = headX + (wx - headX) * P1_MAP_S;
    target.targetY          = P1_MAP_TOP_Y + (wy - headY) * P1_MAP_S;
    const realH = isRight ? realHand1 : realHand1b;
    realH.visible = true;
    realH.position.set(wx, wy - REAL_HAND_R, wz);
    target.targetTilt       = t * Math.PI / 2;
    target.targetScale      = 1;
    target.targetBrightness = t;
    target.laserOn          = src.hand ? (t >= 1) : (t >= 0.95);
    // Track trigger separately for hold-to-fly mechanic (controller uses raw trigger, hand uses laserOn)
    if (src.hand) {
      target.triggerHeld = target.laserOn;
    } else {
      target.triggerHeld = (src.gamepad?.buttons[0]?.value ?? 0) > 0.5;
    }

    // Laser: hands show only when fully extended; controllers show from first trigger pull
    const laser = isRight ? laser1 : laser1b;
    const showLaser = t > 0.1;
    if (showLaser && src.targetRaySpace) {
      const rayPose = frame.getPose(src.targetRaySpace, rs);
      if (rayPose) {
        const rp = rayPose.transform.position, ro = rayPose.transform.orientation;
        _laserQ.set(ro.x, ro.y, ro.z, ro.w);
        _laserDir.set(0, 0, -1).applyQuaternion(_laserQ); // targetRay points along -Z
        if (isRight) { p1LaserOrigin.set(rp.x, rp.y, rp.z); p1LaserDir.copy(_laserDir); }
        else         { p1bLaserOrigin.set(rp.x, rp.y, rp.z); p1bLaserDir.copy(_laserDir); }
        laser.buf[0] = rp.x; laser.buf[1] = rp.y; laser.buf[2] = rp.z;
        laser.buf[3] = rp.x + _laserDir.x * 5;
        laser.buf[4] = rp.y + _laserDir.y * 5;
        laser.buf[5] = rp.z + _laserDir.z * 5;
        laser.line.geometry.attributes.position.needsUpdate = true;
        laser.line.visible = true;
      }
    } else {
      laser.line.visible = false;
    }
  }
}

// ── Shoot / return ────────────────────────────────────────────────────────────
function shootBall(b, shooter, paddleGroup, dir, shooterZ) {
  if (b.state !== 'idle' || gameState !== 'playing') return;
  b.pos.set(shooter.x, shooter.y, shooterZ);
  b.vel.copy(dir).multiplyScalar(SHOOT_SPEED);
  b.clearTrail();
  b.state         = 'flying';
  b.flyTime       = 0;
  b.shooter       = shooter;
  b.shooterPaddle = paddleGroup;
  b.shooterZ      = shooterZ;
  paddleGroup.visible = false;
  soundPaddle();
}

// ── Ball physics ──────────────────────────────────────────────────────────────
function applyP1BrickEffect(idx) {
  if (idx === 0) {
    paddleFlash[0] = 1.0;
    setTimeout(() => { if (gameState === 'playing') { p1.deleted = true; paddle1.visible = false; for (const b of balls) if (b.shooterPaddle === paddle1)  b.shooterPaddle = null; } }, 280);
  } else if (idx === 1) {
    paddleFlash[0] = 1.0; p1.lerpSpeed = PADDLE_LERP_SLOW;
  } else if (idx === 3) {
    paddleFlash[1] = 1.0; p1b.lerpSpeed = PADDLE_LERP_SLOW;
  } else if (idx === 4) {
    paddleFlash[1] = 1.0;
    setTimeout(() => { if (gameState === 'playing') { p1b.deleted = true; paddle1b.visible = false; for (const b of balls) if (b.shooterPaddle === paddle1b) b.shooterPaddle = null; } }, 280);
  }
}

function applyP2BrickEffect(idx) {
  if      (idx === 0) { paddleFlash[3] = 1.0; setTimeout(() => { if (gameState === 'playing') { p2b.deleted = true; paddle2b.visible = false; for (const b of balls) if (b.shooterPaddle === paddle2b) b.shooterPaddle = null; } }, 280); }
  else if (idx === 1) { paddleFlash[3] = 1.0; p2b.speedMult = 0.5; }
  else if (idx === 3) { paddleFlash[2] = 1.0; p2.speedMult  = 0.5; }
  else if (idx === 4) { paddleFlash[2] = 1.0; setTimeout(() => { if (gameState === 'playing') { p2.deleted  = true; paddle2.visible  = false; for (const b of balls) if (b.shooterPaddle === paddle2)  b.shooterPaddle = null; } }, 280); }
}

function deflectBall(b, paddleX, paddleY, newZSign, flashIdx) {
  const dx = b.pos.x - paddleX, dy = b.pos.y - paddleY;
  const d = Math.sqrt(dx*dx + dy*dy);
  const spd = Math.min(b.vel.length() * HIT_SPEEDUP, MAX_SPEED);
  const angle = Math.min(d / PADDLE_R, 1.0) * MAX_DEFLECT;
  const latX = d > 0.001 ? dx/d : 0, latY = d > 0.001 ? dy/d : 0;
  b.vel.set(latX*Math.sin(angle)*spd, latY*Math.sin(angle)*spd, newZSign*Math.cos(angle)*spd);
  paddleFlash[flashIdx] = 1.0;
  soundPaddle();
}

function updateCenterWin(dt) {
  if (!_centerWin) return;
  const cw = _centerWin;
  cw.timer -= dt;
  if (cw.phase === 'flash') {
    if (cw.timer <= 0) {
      cw.flashCount++;
      const vis = (cw.flashCount % 2 === 0);
      cw.brick.mesh.visible = vis;
      cw.brick.edges.visible = vis;
      cw.timer = 0.18;
      if (cw.flashCount >= 8) {
        cw.brick.mesh.visible = false; cw.brick.edges.visible = false;
        const bricks = cw.sideIdx === 0 ? p1Bricks : p2Bricks;
        const body   = cw.sideIdx === 0 ? p1Body   : p2Body;
        for (let i = 0; i < BRICK_COUNT; i++) {
          bricks[i].mesh.visible = false; bricks[i].edges.visible = false; bricks[i].alive = false;
        }
        for (const bp of body) { bp.mesh.visible = false; bp.edges.visible = false; }
        spawnDeathDebris(cw.sideIdx, cw.brick);
        soundBoom();
        cw.phase = 'explode'; cw.timer = 2.2;
      }
    }
  } else if (cw.phase === 'explode') {
    if (cw.timer <= 0) {
      const scorer = cw.scorer;
      _centerWin = null;
      gameState = 'playing';   // restore so scorePoint → endGame works
      scorePoint(scorer, 100);
    }
  }
}

const BRICK_FLASH_INTERVAL = 0.1;
function updateDyingBricks(dt) {
  for (let i = dyingBricks.length - 1; i >= 0; i--) {
    const e = dyingBricks[i];
    e.timer -= dt;
    if (e.timer <= 0) {
      e.phase++;
      e.timer = BRICK_FLASH_INTERVAL;
      const vis = (e.phase % 2 === 0);
      e.brick.mesh.visible = vis;
      e.brick.edges.visible = vis;
      if (e.phase >= 5) {
        e.brick.mesh.visible = false;
        e.brick.edges.visible = false;
        dyingBricks.splice(i, 1);
      }
    }
  }
}

function updateAvatarPose(dt) {
  // P1: signed X velocity from XR head (desktop stays 0)
  let p1Target = 0;
  if (renderer.xr.isPresenting) {
    const hPos = renderer.xr.getCamera().position;
    const xVel = (hPos.x - _prevHeadPos.x) / Math.max(dt, 0.001);
    _prevHeadPos.copy(hPos);
    p1Target = Math.max(-1, Math.min(1, xVel / 0.4));
  }

  // P2: signed X velocity from CPU brick group
  const p2XVel  = (brickGroupX[1] - _prevP2GroupX) / Math.max(dt, 0.001);
  _prevP2GroupX = brickGroupX[1];
  const p2Target = Math.max(-1, Math.min(1, p2XVel / 0.15));

  const speed = 4.0;
  avatarPose[0] += (p1Target - avatarPose[0]) * Math.min(speed * dt, 1);
  avatarPose[1] += (p2Target - avatarPose[1]) * Math.min(speed * dt, 1);

  for (let side = 0; side < 2; side++) {
    const bricks = side === 0 ? p1Bricks : p2Bricks;
    const body   = side === 0 ? p1Body   : p2Body;
    const pose   = avatarPose[side];
    const mag = Math.abs(pose);
    const rz  = -AVATAR_LEAN * pose;
    for (let i = 0; i < BRICK_COUNT; i++) {
      bricks[i].mesh.rotation.z  = rz;
      bricks[i].edges.rotation.z = rz;
      let dx = 0, dy = 0;
      if (i === 0) {
        dx = -0.022 * pose;
        dy =  0.040 * Math.max(0, -pose);  // left arm rises when moving left (front arm)
      } else if (i === 4) {
        dx = -0.022 * pose;
        dy =  0.040 * Math.max(0,  pose);  // right arm rises when moving right (front arm)
      } else if (i === 1) {
        dx = -0.007 * mag;
      } else if (i === 3) {
        dx =  0.007 * mag;
      }
      bricks[i].mesh.position.x  = brickGroupX[side] + bricks[i].localX + dx;
      bricks[i].edges.position.x = brickGroupX[side] + bricks[i].localX + dx;
      bricks[i].mesh.position.y  = BRICK_Y + BRICK_CONFIGS[i].dy + dy;
      bricks[i].edges.position.y = BRICK_Y + BRICK_CONFIGS[i].dy + dy;
    }
    for (let j = 0; j < body.length; j++) {
      body[j].mesh.rotation.z  = rz;
      body[j].edges.rotation.z = rz;
    }
    // Head leads the lean — translates further in movement direction
    body[0].mesh.position.x  = brickGroupX[side] + 0.028 * pose;
    body[0].edges.position.x = brickGroupX[side] + 0.028 * pose;
  }
}

function checkBrickHit(b, bricks, sideIdx, brickZ, velZSign) {
  const front = brickZ + (BRICK_D / 2 + BALL_R) * (-velZSign);
  const back  = brickZ + (BRICK_D / 2 + BALL_R) * ( velZSign);
  const inRange = velZSign < 0
    ? (b.pos.z <= front && b.pos.z >= back)
    : (b.pos.z >= front && b.pos.z <= back);
  if (!inRange) return false;

  // Check destructible arm/shoulder/chest bricks
  for (let i = 0; i < bricks.length; i++) {
    const brick = bricks[i];
    if (!brick.alive) continue;
    if (Math.abs(b.pos.x - brick.x) < brick.w / 2 + BALL_R &&
        Math.abs(b.pos.y - brick.y) < brick.h / 2 + BALL_R) {
      b.pos.z = front;
      b.vel.z = -b.vel.z;
      wallFlash[sideIdx] = 1.0;
      triggerBounceRing(brick.x, brick.y, brickZ, 'z');

      if (i === 2 && brick.state === 'white') {
        // Centre brick first hit: tint to attacker colour, stay alive
        brick.fillMat.color.setHex(sideIdx === 0 ? 0x2255bb : 0xbb2233);
        brick.edgeMat.color.setHex(sideIdx === 0 ? 0x44aaff : 0xff4466);
        brick.state = 'damaged';
        soundBrick();
        updateVRBricks();
      } else {
        brick.alive = false;
        brickCounts[sideIdx]--;
        dyingBricks.push({ brick, phase: 0, timer: BRICK_FLASH_INTERVAL });
        if (i === 2) {
          soundCenterBrick();
          updateVRBricks();
          for (const b of balls) b.vel.set(0, 0, 0);
          gameState = 'centerwin';
          _centerWin = { sideIdx, scorer: 1 - sideIdx, brick, phase: 'flash', flashCount: 0, timer: 0.18, fadeTotal: 0.55 };
        } else {
          soundBoom();
          updateVRBricks();
          if (sideIdx === 0) applyP1BrickEffect(i);
          else               applyP2BrickEffect(i);
        }
      }
      return true;
    }
  }

  // Check avatar body parts: head (index 0) and legs (index 1)
  const body = sideIdx === 0 ? p1Body : p2Body;
  for (let j = 0; j < body.length; j++) {
    const bp = body[j];
    if (!bp.mesh.visible) continue;
    const bpX = bp.mesh.position.x;
    const bpY = bp.mesh.position.y;
    const sx  = bp.mesh.scale.x;
    const sy  = bp.mesh.scale.y;
    if (Math.abs(b.pos.x - bpX) < bp.w * sx / 2 + BALL_R &&
        Math.abs(b.pos.y - bpY) < bp.h * sy / 2 + BALL_R) {
      b.pos.z = front;
      b.vel.z = -b.vel.z;
      wallFlash[sideIdx] = 1.0;
      triggerBounceRing(bpX, bpY, brickZ, 'z');

      if (j === 0) {
        // HEAD — same 2-hit kill mechanic as chest brick
        if (bp.state === 'white') {
          bp.fillMat.color.setHex(sideIdx === 0 ? 0x2255bb : 0xbb2233);
          bp.edgeMat.color.setHex(sideIdx === 0 ? 0x44aaff : 0xff4466);
          bp.state = 'damaged';
          soundBrick();
        } else {
          // Second hit on head — game over
          soundCenterBrick();
          for (const ball of balls) ball.vel.set(0, 0, 0);
          gameState = 'centerwin';
          _centerWin = { sideIdx, scorer: 1 - sideIdx, brick: bp, phase: 'flash', flashCount: 0, timer: 0.18, fadeTotal: 0.55 };
        }
      } else if (j === 1) {
        // LEGS — shrink and slow movement (doesn't disappear)
        const shrink = 0.6;
        bp.mesh.scale.set(shrink, shrink, shrink);
        bp.edges.scale.set(shrink, shrink, shrink);
        bp.state = 'hit';
        soundBrick();
        // Slow down movement
        if (sideIdx === 0) {
          p1.lerpSpeed = PADDLE_LERP_SLOW;
          p1b.lerpSpeed = PADDLE_LERP_SLOW;
        } else {
          p2.speedMult = 0.4;
          p2b.speedMult = 0.4;
        }
      }
      return true;
    }
  }

  return false;
}

function updateBall(dt) {
  if (gameState === 'centerwin') {
    for (const b of balls) {
      if (b.state !== 'idle') { b.mesh.visible = true; b.mesh.position.copy(b.pos); }
    }
    return;
  }
  if (gameState !== 'playing') {
    // Attract / gameover: only balls[0] bounces, others hidden
    for (let i = 1; i < balls.length; i++) balls[i].mesh.visible = false;
    const b = balls[0];
    b.pos.addScaledVector(b.vel, dt);
    if (b.pos.x < -AW/2+BALL_R) { b.pos.x=-AW/2+BALL_R; b.vel.x=Math.abs(b.vel.x); triggerBounceRing(-AW/2,b.pos.y,b.pos.z,'x'); }
    else if (b.pos.x > AW/2-BALL_R) { b.pos.x=AW/2-BALL_R; b.vel.x=-Math.abs(b.vel.x); triggerBounceRing(AW/2,b.pos.y,b.pos.z,'x'); }
    if (b.pos.y < AY+BALL_R) { b.pos.y=AY+BALL_R; b.vel.y=Math.abs(b.vel.y); triggerBounceRing(b.pos.x,AY,b.pos.z,'y'); }
    else if (b.pos.y > AY+AH-BALL_R) { b.pos.y=AY+AH-BALL_R; b.vel.y=-Math.abs(b.vel.y); triggerBounceRing(b.pos.x,AY+AH,b.pos.z,'y'); }
    if (b.vel.z<0 && b.pos.z<BALL_R) { b.pos.z=BALL_R; b.vel.z=Math.abs(b.vel.z); triggerBounceRing(b.pos.x,b.pos.y,0,'z'); }
    else if (b.vel.z>0 && b.pos.z>AD-BALL_R) { b.pos.z=AD-BALL_R; b.vel.z=-Math.abs(b.vel.z); triggerBounceRing(b.pos.x,b.pos.y,AD,'z'); }
    b.pushTrail(b.pos); b.mesh.position.copy(b.pos);
    return;
  }

  // Ball-ball collisions: opposing flying discs meet and Thor back
  for (let ai = 0; ai < 2; ai++) {
    for (let bi = 2; bi < 4; bi++) {
      const a = balls[ai], b = balls[bi];
      if (a.state !== 'flying' || b.state !== 'flying') continue;
      const dx = a.pos.x - b.pos.x, dy = a.pos.y - b.pos.y, dz = a.pos.z - b.pos.z;
      if (dx*dx + dy*dy + dz*dz < (BALL_R * 2.2) * (BALL_R * 2.2)) {
        const tmpZ = a.vel.z; a.vel.z = b.vel.z; b.vel.z = tmpZ;
        a.pos.z -= BALL_R * 3; b.pos.z += BALL_R * 3;
        const mx = (a.pos.x + b.pos.x) * 0.5, my = (a.pos.y + b.pos.y) * 0.5, mz = (a.pos.z + b.pos.z) * 0.5;
        triggerBounceRing(mx, my, mz, 'z');
        soundBrick();
      }
    }
  }

  // Playing: each ball is independent
  for (const b of balls) {
    if (b.state === 'idle') { b.setFade(1.0); b.mesh.visible = false; b.clearTrail(); continue; }

    if (b.state === 'returning' && b.shooter) {
      const dx = b.shooter.x - b.pos.x, dy = b.shooter.y - b.pos.y, dz = b.shooterZ - b.pos.z;
      const d = Math.sqrt(dx*dx + dy*dy + dz*dz);
      if (d < BALL_R * 3) {
        b.state = 'idle'; b.mesh.visible = false;
        if (b.shooterPaddle) { b.shooterPaddle.visible = true; b.shooterPaddle = null; }
        soundPaddle(); continue;
      }
      b.vel.set(dx/d*RETURN_SPEED, dy/d*RETURN_SPEED, dz/d*RETURN_SPEED);
    }

    b.pos.addScaledVector(b.vel, dt);

    if (b.pos.x < -AW/2+BALL_R) { b.pos.x=-AW/2+BALL_R; b.vel.x=Math.abs(b.vel.x); triggerBounceRing(-AW/2,b.pos.y,b.pos.z,'x'); }
    else if (b.pos.x > AW/2-BALL_R) { b.pos.x=AW/2-BALL_R; b.vel.x=-Math.abs(b.vel.x); triggerBounceRing(AW/2,b.pos.y,b.pos.z,'x'); }
    if (b.pos.y < AY+BALL_R) { b.pos.y=AY+BALL_R; b.vel.y=Math.abs(b.vel.y); triggerBounceRing(b.pos.x,AY,b.pos.z,'y'); }
    else if (b.pos.y > AY+AH-BALL_R) { b.pos.y=AY+AH-BALL_R; b.vel.y=-Math.abs(b.vel.y); triggerBounceRing(b.pos.x,AY+AH,b.pos.z,'y'); }

    if (b.state === 'flying') {
      b.flyTime += dt;
      // CPU auto-recall after timeout
      if (b.flyTime > 4.5 && (b.shooter === p2 || b.shooter === p2b)) { b.state = 'returning'; continue; }
      // Hand influence on flying P1 discs: lateral steering (aftertouch)
      if (b.shooter === p1 || b.shooter === p1b) {
        const sh = b.shooter;
        b.vel.x += sh.xRate * STEER_FORCE * dt;
        b.vel.y += sh.yRate * STEER_FORCE * dt;
      }
      // P1 paddles deflect incoming balls
      if (b.vel.z < 0 && b.pos.z < PADDLE_INSET + BALL_R) {
        const r0 = PADDLE_R * p1.scale + BALL_R, r1 = PADDLE_R * p1b.scale + BALL_R;
        const dx0 = b.pos.x-p1.x,  dy0 = b.pos.y-p1.y;
        const dx1 = b.pos.x-p1b.x, dy1 = b.pos.y-p1b.y;
        if (!p1.deleted  && paddle1.visible  && dx0*dx0+dy0*dy0 < r0*r0) { b.pos.z=PADDLE_INSET+BALL_R; deflectBall(b,p1.x, p1.y, 1,0); if (b.shooter===p2||b.shooter===p2b) b.state='returning'; triggerBounceRing(p1.x, p1.y, PADDLE_INSET,'z'); continue; }
        if (!p1b.deleted && paddle1b.visible && dx1*dx1+dy1*dy1 < r1*r1) { b.pos.z=PADDLE_INSET+BALL_R; deflectBall(b,p1b.x,p1b.y,1,1); if (b.shooter===p2||b.shooter===p2b) b.state='returning'; triggerBounceRing(p1b.x,p1b.y,PADDLE_INSET,'z'); continue; }
      }
      // Bricks first — they're flush with the end walls, same z threshold as wall bounce
      if (b.vel.z > 0 && checkBrickHit(b,p2Bricks,1,BRICK_Z2,+1)) { continue; }
      if (b.vel.z < 0 && checkBrickHit(b,p1Bricks,0,BRICK_Z1,-1)) { continue; }
      // End walls bounce like Pong — no scoring on wall contact
      if (b.vel.z > 0 && b.pos.z > AD-BALL_R) {
        b.pos.z=AD-BALL_R; b.vel.z=-Math.abs(b.vel.z); triggerBounceRing(b.pos.x,b.pos.y,AD,'z');
      }
      if (b.vel.z < 0 && b.pos.z < BALL_R) {
        b.pos.z=BALL_R; b.vel.z=Math.abs(b.vel.z); triggerBounceRing(b.pos.x,b.pos.y,0,'z');
      }
    }

    b.setFade(b.state === 'returning' ? 0.35 : 1.0);
    b.mesh.visible = true;
    b.pushTrail(b.pos);
    b.mesh.position.copy(b.pos);
  }
}

// ── Audio ─────────────────────────────────────────────────────────────────────
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function blip(freq, dur, vol = 0.35) {
  if (audioCtx.state !== 'running') return;
  try {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}

const soundPaddle = () => blip(480, 0.08, 0.4);
const soundWall   = () => blip(240, 0.06, 0.2);
const soundBrick  = () => { blip(320, 0.07, 0.45); setTimeout(() => blip(180, 0.12, 0.35), 70); };
const soundBoom   = () => { blip(100, 0.25, 0.9); setTimeout(() => blip(65, 0.35, 0.7), 30); setTimeout(() => blip(40, 0.45, 0.5), 80); };
const soundCenterBrick = () => {
  blip(220, 0.3, 0.5);
  setTimeout(() => blip(330, 0.35, 0.55), 150);
  setTimeout(() => blip(440, 0.4,  0.6),  320);
  setTimeout(() => blip(660, 0.5,  0.65), 550);
  setTimeout(() => blip(880, 0.6,  0.5),  850);
};
function soundWin() {
  blip(440, 0.12, 0.5); setTimeout(() => blip(560, 0.14, 0.55), 140);
  setTimeout(() => blip(880, 0.22, 0.6), 300);
}

// ── Resize ────────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Main loop ─────────────────────────────────────────────────────────────────
const clock = new THREE.Clock();

renderer.setAnimationLoop((time, frame) => {
  const dt = Math.min(clock.getDelta(), 0.05);

  if (frame) {
    updateXRPaddles(frame, dt);
    if (gameState === 'playing') {
      // Rising edge: shoot frisbee when trigger pressed / hand extended
      if (p1.triggerHeld  && !p1.wasTriggerHeld  && !p1.deleted)  shootBall(balls[0], p1,  paddle1,  p1LaserDir,  PADDLE_INSET);
      if (p1b.triggerHeld && !p1b.wasTriggerHeld && !p1b.deleted) shootBall(balls[1], p1b, paddle1b, p1bLaserDir, PADDLE_INSET);
      // Falling edge: return frisbee when trigger released / hand retracted
      if (!p1.triggerHeld  && p1.wasTriggerHeld  && balls[0].state === 'flying' && balls[0].shooter === p1)   balls[0].state = 'returning';
      if (!p1b.triggerHeld && p1b.wasTriggerHeld && balls[1].state === 'flying' && balls[1].shooter === p1b)  balls[1].state = 'returning';
    }
    p1.wasTriggerHeld  = p1.triggerHeld;
    p1b.wasTriggerHeld = p1b.triggerHeld;
    p1.wasLaserOn  = p1.laserOn;
    p1b.wasLaserOn = p1b.laserOn;
  }

  // Lerp P1 paddles toward targets (respects lerpSpeed penalty from brick hits)
  if (!p1.deleted) {
    const ls = Math.min(p1.lerpSpeed * dt, 1);
    p1.x += (p1.targetX - p1.x) * ls; p1.y += (p1.targetY - p1.y) * ls;
    clampPaddle(p1);
  }
  if (!p1b.deleted) {
    const ls = Math.min(p1b.lerpSpeed * dt, 1);
    p1b.x += (p1b.targetX - p1b.x) * ls; p1b.y += (p1b.targetY - p1b.y) * ls;
    clampPaddle(p1b);
  }
  // Smooth tilt, scale, and brightness toward targets
  const ts = Math.min(12 * dt, 1);
  p1.tilt   += (p1.targetTilt   - p1.tilt)   * ts;
  p1b.tilt  += (p1b.targetTilt  - p1b.tilt)  * ts;
  p1.scale  += (p1.targetScale  - p1.scale)  * ts;
  p1b.scale += (p1b.targetScale - p1b.scale) * ts;
  p1.brightness  += (p1.targetBrightness  - p1.brightness)  * ts;
  p1b.brightness += (p1b.targetBrightness - p1b.brightness) * ts;
  p2.tilt   += (p2.targetTilt   - p2.tilt)   * ts;
  p2b.tilt  += (p2b.targetTilt  - p2b.tilt)  * ts;
  p2.scale  += (p2.targetScale  - p2.scale)  * ts;
  p2b.scale += (p2b.targetScale - p2b.scale) * ts;
  p2.brightness  += (p2.targetBrightness  - p2.brightness)  * ts;
  p2b.brightness += (p2b.targetBrightness - p2b.brightness) * ts;

  updateCpu(dt);   // also calls updateBrickGroupX(1, p2HeadX)
  updateCpuShooting(dt);
  updateBall(dt);
  updateDyingBricks(dt);
  updateCenterWin(dt);
  updateDebris(dt);

  // P1 brick group tracks human head
  const headX = renderer.xr.isPresenting ? renderer.xr.getCamera().position.x : _p1CenterX;
  updateBrickGroupX(0, headX);
  updateAvatarPose(dt);

  if (vrStartMesh.visible) vrStartMat.opacity = (time % 1200 < 600) ? 1.0 : 0.0;

  if (wallFlash[0] > 0) { wallFlash[0] = Math.max(0, wallFlash[0] - dt / 0.4); p1WallMat.opacity = wallFlash[0] * 0.55; }
  if (wallFlash[1] > 0) { wallFlash[1] = Math.max(0, wallFlash[1] - dt / 0.4); p2WallMat.opacity = wallFlash[1] * 0.55; }

  const faceMats = [p1FaceMat, p1bFaceMat, p2FaceMat, p2bFaceMat];
  const baseRingColors = [_p1BaseColor, _p1bBaseColor, _p2BaseColor, _p2bBaseColor];
  for (let i = 0; i < 4; i++) {
    if (paddleFlash[i] > 0) {
      paddleFlash[i] = Math.max(0, paddleFlash[i] - dt / 1.2);
      faceMats[i].color.lerpColors(baseRingColors[i], _whiteColor, paddleFlash[i]);
    } else {
      faceMats[i].color.copy(baseRingColors[i]);
    }
  }

  if (missFlash[0] > 0) { missFlash[0] = Math.max(0, missFlash[0] - dt / 1.8); miss1.fillMat.opacity = missFlash[0] * 0.18; miss1.rimMat.opacity = missFlash[0] * 0.7; }
  if (missFlash[1] > 0) { missFlash[1] = Math.max(0, missFlash[1] - dt / 1.8); miss2.fillMat.opacity = missFlash[1] * 0.18; miss2.rimMat.opacity = missFlash[1] * 0.7; }
  for (const r of bounceRings) {
    if (r.flash > 0) { r.flash = Math.max(0, r.flash - dt / 0.4); r.fillMat.opacity = r.flash * 0.18; r.rimMat.opacity = r.flash * 0.7; }
  }
  // ball mesh/trail updates handled inside updateBall per-ball loop
  // Group origin is at bottom edge — rotation and scale both pivot from there
  paddle1.position.set(p1.x,   p1.y   - PADDLE_R, PADDLE_INSET);  paddle1.rotation.set(p1.tilt,  0, 0);  paddle1.scale.setScalar(p1.scale);
  paddle1b.position.set(p1b.x, p1b.y  - PADDLE_R, PADDLE_INSET);  paddle1b.rotation.set(p1b.tilt, 0, 0);  paddle1b.scale.setScalar(p1b.scale);
  paddle2.position.set(p2.x,   p2.y   - PADDLE_R, AD - PADDLE_INSET);  paddle2.rotation.set(-p2.tilt,  Math.PI, 0);  paddle2.scale.setScalar(p2.scale);
  paddle2b.position.set(p2b.x, p2b.y  - PADDLE_R, AD - PADDLE_INSET);  paddle2b.rotation.set(-p2b.tilt, Math.PI, 0);  paddle2b.scale.setScalar(p2b.scale);

  if (!renderer.xr.isPresenting) { realHand1.visible = false; realHand1b.visible = false; }
  // Laser visibility is managed inside updateXRPaddles; hide both outside VR
  if (!renderer.xr.isPresenting) { laser1.line.visible = false; laser1b.line.visible = false; }

  if (vrScoreMesh.visible) {
    vrScoreMesh.position.y += (vrScoreTargetY - vrScoreMesh.position.y) * Math.min(dt * 2.5, 1);
  }

  if (arenaAnimTime >= 0) {
    arenaAnimTime = Math.min(arenaAnimTime + dt, ARENA_ANIM_DURATION);
    const t = arenaAnimTime / ARENA_ANIM_DURATION, ease = t * t * (3 - 2 * t);
    arenaRoot.scale.setScalar(arenaAnimFromSc + (arenaAnimToSc - arenaAnimFromSc) * ease);
    arenaRoot.position.lerpVectors(_arenaFromPos, _arenaToPos, ease);
    arenaRoot.rotation.y = arenaAnimFromRot + (arenaAnimToRot - arenaAnimFromRot) * ease;
    if (arenaAnimTime >= ARENA_ANIM_DURATION) {
      arenaAnimTime = -1;
      arenaRoot.scale.setScalar(arenaAnimToSc); arenaRoot.position.copy(_arenaToPos); arenaRoot.rotation.y = arenaAnimToRot;
      if (_arenaOnDone) { _arenaOnDone(); _arenaOnDone = null; }
    }
  }

  if (camAnimTime >= 0) {
    camAnimTime = Math.min(camAnimTime + dt, CAM_ANIM_DURATION);
    const t = camAnimTime / CAM_ANIM_DURATION, ease = t * t * (3 - 2 * t);
    camera.position.lerpVectors(_camFrom, _camTo, ease);
    controls.target.lerpVectors(_camFromT, _camToT, ease);
    camera.lookAt(controls.target);
    if (camAnimTime >= CAM_ANIM_DURATION) {
      camAnimTime = -1; camera.position.copy(_camTo); controls.target.copy(_camToT);
      controls.enabled = true; controls.update();
      if (_camOnDone) { _camOnDone(); _camOnDone = null; }
    }
  } else if (!renderer.xr.isPresenting) {
    controls.update();
  }

  renderer.render(scene, camera);
});
</script>
</body>
