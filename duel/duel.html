<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DUEL</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #4a5a4a; overflow: hidden; }
    #hud {
      position: absolute; top: 14px; left: 50%;
      transform: translateX(-50%);
      color: #fff; font-family: monospace; font-size: 13px;
      text-align: center; line-height: 1.8; pointer-events: none;
      letter-spacing: 0.12em; text-shadow: 0 1px 4px #0008;
    }
    #scoreboard {
      display: flex; gap: 28px; align-items: center; justify-content: center;
      font-size: 52px; font-weight: bold; line-height: 1;
    }
    .pip { width: 11px; height: 11px; display: inline-block; margin-right: 6px; vertical-align: middle; }
    #legend {
      position: absolute; bottom: 60px; left: 14px;
      color: #aab; font-family: monospace; font-size: 11px;
      line-height: 2; pointer-events: none;
    }
    #attract {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      pointer-events: none; opacity: 0; transition: opacity 0.5s;
    }
    #attract.visible { opacity: 1; }
    #attract-title {
      color: #eef; font-family: monospace; font-size: 48px; font-weight: bold;
      letter-spacing: 0.25em; text-shadow: 0 0 24px #44ccbb88;
    }
    #attract-sub {
      color: #88bbaa; font-family: monospace; font-size: 13px;
      margin-top: 10px; letter-spacing: 0.15em;
    }
    @keyframes blink { 50% { opacity: 0; } }
    #attract-start {
      color: #fff; font-family: monospace; font-size: 15px; letter-spacing: 0.2em;
      margin-top: 28px; animation: blink 1.1s step-end infinite;
    }
    #game-over {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      pointer-events: none; opacity: 0; transition: opacity 0.5s;
    }
    #game-over.visible { opacity: 1; }
    #winner-text {
      color: #eef; font-family: monospace; font-size: 32px; font-weight: bold;
      letter-spacing: 0.2em; text-shadow: 0 0 18px #44ccbb88;
    }
    #game-over-start {
      color: #88bbaa; font-family: monospace; font-size: 13px; letter-spacing: 0.18em;
      margin-top: 20px; animation: blink 1.1s step-end infinite;
    }
  </style>
</head>
<body>

<div id="hud">
  <div id="scoreboard">
    <span><span class="pip" style="background:#dd5533"></span><span id="score-p1">0</span></span>
    <span style="font-size:22px;opacity:0.4">—</span>
    <span><span class="pip" style="background:#3377dd"></span><span id="score-p2">0</span></span>
  </div>
</div>

<div id="attract" class="visible">
  <div id="attract-title">DUEL</div>
  <div id="attract-sub">disc · wall bounce · shield parry</div>
  <div id="attract-start">CLICK OR PRESS ANY KEY TO START</div>
</div>

<div id="game-over">
  <div id="winner-text">P1 WINS</div>
  <div id="game-over-start">CLICK OR PRESS ANY KEY TO PLAY AGAIN</div>
</div>

<div id="legend">drag to orbit · scroll to zoom · mouse = shield</div>

<div id="err" style="display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#f66;font-family:monospace;font-size:13px;text-align:center"></div>
<script>window.onerror = (msg) => { const e = document.getElementById('err'); e.style.display='block'; e.textContent = 'Error: ' + msg; };</script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Renderer ──────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x4a5a4a);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
camera.position.set(5.2, 4.0, -1.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.3, 1.5);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.update();

// ── Dimensions ────────────────────────────────────────────────────────────────
const TABLE_Y  = 0.76;
const TABLE_L  = 3.00;
const TABLE_W  = 1.80;
const TABLE_T  = 0.05;
const LEG_H    = TABLE_Y - TABLE_T;
const ARENA_H  = 2.10;
const ARENA_CZ = TABLE_L / 2;

const SHIELD_R   = 0.20;
const BLK_W      = 0.38;
const BLK_H      = 0.15;
const BLK_D      = 0.13;
const BLK_STEP   = 0.41;
const HAND_Y     = TABLE_Y + 0.38;
const HAND_X     = 0.78;
const BLOCK_Z    = 0.14;

const P1_Z = 0.0;
const P2_Z = TABLE_L;

const DISC_R       = 0.06;
const SHIELD_INSET = 0.20;   // Z distance from end where shield plays
const WIN_SCORE    = 7;

// ── Helpers ───────────────────────────────────────────────────────────────────
function seg(a, b, color, opacity) {
  const mat = opacity !== undefined
    ? new THREE.LineBasicMaterial({ color, transparent: true, opacity })
    : new THREE.LineBasicMaterial({ color });
  return new THREE.Line(new THREE.BufferGeometry().setFromPoints([a, b]), mat);
}

function box(w, h, d, color, opacity, wireframe) {
  const geo  = new THREE.BoxGeometry(w, h, d);
  const mat  = new THREE.MeshBasicMaterial({
    color, wireframe: !!wireframe,
    transparent: opacity !== undefined, opacity: opacity ?? 1.0
  });
  return new THREE.Mesh(geo, mat);
}

// ── Table ─────────────────────────────────────────────────────────────────────
{
  const top = box(TABLE_W, TABLE_T, TABLE_L, 0x1e6b30);
  top.position.set(0, TABLE_Y - TABLE_T / 2, ARENA_CZ);
  scene.add(top);

  const topEdges = new THREE.LineSegments(
    new THREE.EdgesGeometry(new THREE.BoxGeometry(TABLE_W, TABLE_T, TABLE_L)),
    new THREE.LineBasicMaterial({ color: 0x336622 })
  );
  topEdges.position.copy(top.position);
  scene.add(topEdges);

  const LY = TABLE_Y + 0.002;
  const x1 = -TABLE_W / 2, x2 = TABLE_W / 2;

  const border = [
    new THREE.Vector3(x1, LY, 0),   new THREE.Vector3(x2, LY, 0),
    new THREE.Vector3(x2, LY, TABLE_L), new THREE.Vector3(x1, LY, TABLE_L),
    new THREE.Vector3(x1, LY, 0),
  ];
  scene.add(new THREE.Line(
    new THREE.BufferGeometry().setFromPoints(border),
    new THREE.LineBasicMaterial({ color: 0xffffff })
  ));

  scene.add(seg(
    new THREE.Vector3(x1, LY, ARENA_CZ),
    new THREE.Vector3(x2, LY, ARENA_CZ),
    0xffffff
  ));
  scene.add(seg(
    new THREE.Vector3(0, LY, 0),
    new THREE.Vector3(0, LY, TABLE_L),
    0xffffff
  ));

  const legW = 0.06;
  [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([sx, sz]) => {
    const leg = box(legW, LEG_H, legW, 0x5a3510);
    leg.position.set(sx * (TABLE_W/2 - 0.12), LEG_H/2, ARENA_CZ + sz * (TABLE_L/2 - 0.12));
    scene.add(leg);
  });
}

// ── Arena walls + ceiling ─────────────────────────────────────────────────────
{
  const geo = new THREE.BoxGeometry(TABLE_W, ARENA_H, TABLE_L);
  const cy  = TABLE_Y + ARENA_H / 2;

  const walls = new THREE.Mesh(geo,
    new THREE.MeshBasicMaterial({ color: 0x3a6a44, transparent: true, opacity: 0.16, side: THREE.BackSide })
  );
  walls.position.set(0, cy, ARENA_CZ);
  scene.add(walls);

  const edges = new THREE.LineSegments(
    new THREE.EdgesGeometry(geo),
    new THREE.LineBasicMaterial({ color: 0x77bb88 })
  );
  edges.position.set(0, cy, ARENA_CZ);
  scene.add(edges);
}

// ── makePlayer ────────────────────────────────────────────────────────────────
function makePlayer(shootHand) {
  const g = new THREE.Group();
  const C = 0xffffff;

  const J = {
    lFoot:     new THREE.Vector3(-0.15, 0,    0),
    rFoot:     new THREE.Vector3( 0.15, 0,    0),
    lKnee:     new THREE.Vector3(-0.15, 0.55, 0),
    rKnee:     new THREE.Vector3( 0.15, 0.55, 0),
    lHip:      new THREE.Vector3(-0.12, 1.02, 0),
    rHip:      new THREE.Vector3( 0.12, 1.02, 0),
    spine:     new THREE.Vector3( 0,    1.30, 0),
    lShoulder: new THREE.Vector3(-0.30, 1.65, 0),
    rShoulder: new THREE.Vector3( 0.30, 1.65, 0),
    neck:      new THREE.Vector3( 0,    1.75, 0),
    lElbow:    new THREE.Vector3(-0.50, 1.42, 0),
    rElbow:    new THREE.Vector3( 0.50, 1.42, 0),
    lHand:     new THREE.Vector3(-HAND_X, HAND_Y, 0.05),
    rHand:     new THREE.Vector3( HAND_X, HAND_Y, 0.05),
  };

  [
    ['lFoot','lKnee'],['lKnee','lHip'],
    ['rFoot','rKnee'],['rKnee','rHip'],
    ['lHip','rHip'],['lHip','spine'],['rHip','spine'],
    ['spine','lShoulder'],['spine','rShoulder'],['spine','neck'],
    ['lShoulder','lElbow'],['lElbow','lHand'],
    ['rShoulder','rElbow'],['rElbow','rHand'],
  ].forEach(([a,b]) => g.add(seg(J[a], J[b], C)));

  const head = new THREE.Mesh(
    new THREE.SphereGeometry(0.145, 12, 8),
    new THREE.MeshBasicMaterial({ color: C, wireframe: true })
  );
  head.position.set(0, 1.92, 0);
  g.add(head);

  // Shoot-hand indicator (small teal sphere, no shield)
  const shootPos = shootHand === 'left' ? J.lHand : J.rHand;
  const shootDot = new THREE.Mesh(
    new THREE.SphereGeometry(0.04, 10, 7),
    new THREE.MeshBasicMaterial({ color: 0x44ccbb })
  );
  shootDot.position.copy(shootPos);
  g.add(shootDot);

  [-2,-1,0,1,2].forEach(i => {
    const isChest = i === 0;
    const s   = isChest ? 1.25 : 1.0;
    const geo = new THREE.BoxGeometry(BLK_W * s, BLK_H * s, BLK_D * s);

    const fill = new THREE.Mesh(geo,
      new THREE.MeshBasicMaterial({ color: isChest ? 0xc07028 : 0xd4944a, transparent: true, opacity: 0.82 })
    );
    fill.position.set(i * BLK_STEP, HAND_Y, BLOCK_Z);
    g.add(fill);

    const edges = new THREE.LineSegments(
      new THREE.EdgesGeometry(geo),
      new THREE.LineBasicMaterial({ color: isChest ? 0x7a3410 : 0x8b5218 })
    );
    edges.position.set(i * BLK_STEP, HAND_Y, BLOCK_Z);
    g.add(edges);
  });

  return g;
}

// Players (static backdrop)
const p1Fig = makePlayer('left');
p1Fig.position.set(0, 0, P1_Z);
scene.add(p1Fig);

const p2Fig = makePlayer('right');
p2Fig.position.set(0, 0, P2_Z);
p2Fig.rotation.y = Math.PI;
scene.add(p2Fig);

// ── Gameplay shield meshes ─────────────────────────────────────────────────────
function makeShield(color) {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(
    new THREE.CircleGeometry(SHIELD_R, 32),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.28, side: THREE.DoubleSide })
  ));
  g.add(new THREE.Mesh(
    new THREE.TorusGeometry(SHIELD_R, 0.014, 8, 40),
    new THREE.MeshBasicMaterial({ color })
  ));
  [
    [new THREE.Vector3(-SHIELD_R,0,0), new THREE.Vector3(SHIELD_R,0,0)],
    [new THREE.Vector3(0,-SHIELD_R,0), new THREE.Vector3(0,SHIELD_R,0)],
  ].forEach(([a,b]) => g.add(seg(a, b, color, 0.5)));
  return g;
}

const p1ShieldMesh = makeShield(0xdd5533);
scene.add(p1ShieldMesh);
const p2ShieldMesh = makeShield(0x3377dd);
scene.add(p2ShieldMesh);

// ── Disc mesh ─────────────────────────────────────────────────────────────────
const discMesh = new THREE.Mesh(
  new THREE.SphereGeometry(DISC_R, 12, 9),
  new THREE.MeshBasicMaterial({ color: 0x44ccbb })
);
scene.add(discMesh);

// Disc glow sprite
{
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0,   'rgba(68,204,187,0.9)');
  g.addColorStop(0.4, 'rgba(68,204,187,0.4)');
  g.addColorStop(1,   'rgba(68,204,187,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 64, 64);
  const sprite = new THREE.Sprite(
    new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false })
  );
  sprite.scale.set(0.28, 0.28, 1);
  discMesh.add(sprite);
}

// Trail
const TRAIL = 16;
const trailMeshes = Array.from({ length: TRAIL }, (_, i) => {
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(DISC_R * (1 - i / TRAIL) * 0.6, 6, 4),
    new THREE.MeshBasicMaterial({ color: 0x44ccbb, transparent: true, opacity: (1 - i / TRAIL) * 0.28, depthWrite: false })
  );
  scene.add(m);
  return m;
});
const trailBuf = Array.from({ length: TRAIL }, () => new THREE.Vector3(-99, 0, 0));
let trailHead = 0;
function pushTrail(pos) {
  trailBuf[trailHead].copy(pos);
  trailHead = (trailHead + 1) % TRAIL;
  for (let i = 0; i < TRAIL; i++)
    trailMeshes[i].position.copy(trailBuf[(trailHead + TRAIL - 1 - i) % TRAIL]);
}

// Wall flash materials
const wallFlashL = new THREE.MeshBasicMaterial({ color: 0x44ccbb, transparent: true, opacity: 0, side: THREE.DoubleSide });
const wallFlashR = new THREE.MeshBasicMaterial({ color: 0x44ccbb, transparent: true, opacity: 0, side: THREE.DoubleSide });
let wallFlashLt = 0, wallFlashRt = 0;
{
  const geo = new THREE.PlaneGeometry(ARENA_H, TABLE_L);
  const mL = new THREE.Mesh(geo, wallFlashL);
  mL.rotation.y = Math.PI / 2;
  mL.position.set(-TABLE_W/2, TABLE_Y + ARENA_H/2, ARENA_CZ);
  scene.add(mL);
  const mR = new THREE.Mesh(geo, wallFlashR);
  mR.rotation.y = -Math.PI / 2;
  mR.position.set(TABLE_W/2, TABLE_Y + ARENA_H/2, ARENA_CZ);
  scene.add(mR);
}

// Shield flash
let p1ShieldFlash = 0, p2ShieldFlash = 0;

// Floor
scene.add(new THREE.GridHelper(10, 28, 0x3a4a3a, 0x333a33));

// ── Audio ─────────────────────────────────────────────────────────────────────
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
window.addEventListener('pointerdown', () => {
  if (audioCtx.state === 'suspended') audioCtx.resume();
}, { once: true });

function blip(freq1, freq2, dur, vol, type = 'square') {
  try {
    if (audioCtx.state === 'suspended') return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = type;
    o.frequency.setValueAtTime(freq1, audioCtx.currentTime);
    o.frequency.linearRampToValueAtTime(freq2, audioCtx.currentTime + dur * 0.6);
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}

const soundThrow  = () => blip(240, 560, 0.13, 0.26, 'triangle');
const soundBounce = () => blip(680, 260, 0.09, 0.30, 'square');
const soundParry  = () => blip(480, 820, 0.11, 0.38, 'square');
const soundScore  = () => { blip(200, 100, 0.13, 0.38, 'square'); setTimeout(() => blip(300, 560, 0.18, 0.42, 'square'), 140); };
const soundWin    = () => { blip(320, 640, 0.15, 0.45, 'square'); setTimeout(() => blip(480, 960, 0.20, 0.50, 'square'), 160); setTimeout(() => blip(640, 1280, 0.28, 0.55, 'square'), 340); };

// ── Game state ────────────────────────────────────────────────────────────────
let gameState = 'attract';  // 'attract' | 'serving' | 'playing' | 'gameover'
const score = [0, 0];
let serveTimer = 0;
let serveSide  = 0;  // 0 = P1 serves, 1 = P2 serves

const disc = {
  pos: new THREE.Vector3(0, HAND_Y, TABLE_L / 2),
  vel: new THREE.Vector3(0, 0, 0),
};

const p1Shield = { x: 0 };
const p2Shield = { x: 0 };

// CPU constants
const CPU_SPEED = 2.2;
const CPU_ERR   = 0.08;
let cpuOffset = 0;
function resetCpuOffset() { cpuOffset = (Math.random() - 0.5) * 2 * CPU_ERR; }
resetCpuOffset();

const scoreP1El    = document.getElementById('score-p1');
const scoreP2El    = document.getElementById('score-p2');
const attractEl    = document.getElementById('attract');
const gameOverEl   = document.getElementById('game-over');
const winnerTextEl = document.getElementById('winner-text');

function clampShield(s) {
  s.x = THREE.MathUtils.clamp(s.x, -TABLE_W/2 + SHIELD_R, TABLE_W/2 - SHIELD_R);
}

function doServe() {
  // Launch from serving player toward opponent with random lateral angle
  const angle = (Math.random() - 0.5) * 0.8;
  const speed = 2.2;
  const zDir  = serveSide === 0 ? 1 : -1;
  disc.pos.set(0, HAND_Y, serveSide === 0 ? P1_Z + SHIELD_INSET + DISC_R : P2_Z - SHIELD_INSET - DISC_R);
  disc.vel.set(Math.sin(angle) * speed, 0, zDir * Math.cos(angle) * speed);
  for (let i = 0; i < TRAIL; i++) trailBuf[i].set(-99, 0, 0);
  soundThrow();
  gameState = 'playing';
}

function resetRound(scorerIdx) {
  score[scorerIdx]++;
  scoreP1El.textContent = score[0];
  scoreP2El.textContent = score[1];
  soundScore();

  if (score[scorerIdx] >= WIN_SCORE) {
    gameState = 'gameover';
    winnerTextEl.textContent = scorerIdx === 0 ? 'P1 WINS' : 'P2 WINS';
    gameOverEl.classList.add('visible');
    disc.vel.set(0, 0, 0);
    disc.pos.set(0, HAND_Y, TABLE_L / 2);
    soundWin();
    return;
  }

  // Loser serves next
  serveSide  = scorerIdx === 0 ? 1 : 0;
  gameState  = 'serving';
  serveTimer = 1.0;
  disc.vel.set(0, 0, 0);
  disc.pos.set(0, HAND_Y, TABLE_L / 2);
  resetCpuOffset();
}

function startGame() {
  score[0] = score[1] = 0;
  scoreP1El.textContent = '0';
  scoreP2El.textContent = '0';
  p1Shield.x = 0; p2Shield.x = 0;
  serveSide  = 0;
  gameState  = 'serving';
  serveTimer = 1.2;
  disc.vel.set(0, 0, 0);
  disc.pos.set(0, HAND_Y, TABLE_L / 2);
  for (let i = 0; i < TRAIL; i++) trailBuf[i].set(-99, 0, 0);
  attractEl.classList.remove('visible');
  gameOverEl.classList.remove('visible');
  resetCpuOffset();
}

// ── Mouse → P1 shield ─────────────────────────────────────────────────────────
window.addEventListener('mousemove', e => {
  if (gameState !== 'playing' && gameState !== 'serving') return;
  // Map mouse X (0–1 screen) to shield X within table bounds
  const nx = (e.clientX / innerWidth) * 2 - 1;
  p1Shield.x = nx * (TABLE_W / 2 - SHIELD_R * 0.5);
  clampShield(p1Shield);
});

// Start / restart on any key or click
function handleStart() {
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (gameState === 'attract' || gameState === 'gameover') startGame();
}
window.addEventListener('keydown',  handleStart);
window.addEventListener('pointerdown', handleStart);

// ── CPU P2 ────────────────────────────────────────────────────────────────────
function updateCpu(dt) {
  // P2 tracks disc when it's heading toward them (vel.z > 0)
  const target = disc.vel.z > 0 ? disc.pos.x + cpuOffset : 0;
  const dx = target - p2Shield.x;
  const move = Math.min(Math.abs(dx), CPU_SPEED * dt);
  p2Shield.x += Math.sign(dx) * move;
  clampShield(p2Shield);
}

// ── Disc physics ──────────────────────────────────────────────────────────────
const WALL_X = TABLE_W / 2 - DISC_R;

function updateDisc(dt) {
  if (gameState !== 'playing') return;

  disc.pos.addScaledVector(disc.vel, dt);

  // Side wall bounces
  if (disc.pos.x < -WALL_X) {
    disc.pos.x = -WALL_X; disc.vel.x = Math.abs(disc.vel.x);
    wallFlashLt = 1.0; soundBounce();
  } else if (disc.pos.x > WALL_X) {
    disc.pos.x = WALL_X; disc.vel.x = -Math.abs(disc.vel.x);
    wallFlashRt = 1.0; soundBounce();
  }

  // P1 end (z → 0)
  if (disc.vel.z < 0 && disc.pos.z < P1_Z + SHIELD_INSET + DISC_R) {
    const dx = disc.pos.x - p1Shield.x;
    if (Math.abs(dx) < SHIELD_R + DISC_R) {
      // Parried — reflect and add deflection based on hit offset
      disc.pos.z = P1_Z + SHIELD_INSET + DISC_R;
      const norm   = dx / SHIELD_R;
      const spd    = Math.min(disc.vel.length() * 1.06, 4.5);
      const angle  = norm * (50 * Math.PI / 180);
      disc.vel.set(Math.sin(angle) * spd, 0, Math.cos(angle) * spd);
      p1ShieldFlash = 1.0;
      soundParry();
    } else if (disc.pos.z < P1_Z - 0.2) {
      resetRound(1);  // P2 scores
    }
  }

  // P2 end (z → TABLE_L)
  if (disc.vel.z > 0 && disc.pos.z > P2_Z - SHIELD_INSET - DISC_R) {
    const dx = disc.pos.x - p2Shield.x;
    if (Math.abs(dx) < SHIELD_R + DISC_R) {
      disc.pos.z = P2_Z - SHIELD_INSET - DISC_R;
      const norm   = dx / SHIELD_R;
      const spd    = Math.min(disc.vel.length() * 1.06, 4.5);
      const angle  = norm * (50 * Math.PI / 180);
      disc.vel.set(Math.sin(angle) * spd, 0, -Math.cos(angle) * spd);
      p2ShieldFlash = 1.0;
      soundParry();
      resetCpuOffset();
    } else if (disc.pos.z > P2_Z + 0.2) {
      resetRound(0);  // P1 scores
    }
  }
}

// ── Resize ────────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── Main loop ─────────────────────────────────────────────────────────────────
const clock = new THREE.Clock();

renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);

  // Serve countdown
  if (gameState === 'serving') {
    serveTimer -= dt;
    if (serveTimer <= 0) doServe();
  }

  updateCpu(dt);
  updateDisc(dt);
  pushTrail(disc.pos);

  // Position shields
  p1ShieldMesh.position.set(p1Shield.x, HAND_Y, P1_Z + SHIELD_INSET);
  p1ShieldMesh.rotation.set(0, 0, 0);

  p2ShieldMesh.position.set(p2Shield.x, HAND_Y, P2_Z - SHIELD_INSET);
  p2ShieldMesh.rotation.set(0, Math.PI, 0);

  // Shield flash
  const p1ShieldFill = p1ShieldMesh.children[0];
  const p2ShieldFill = p2ShieldMesh.children[0];
  if (p1ShieldFlash > 0) {
    p1ShieldFlash = Math.max(0, p1ShieldFlash - dt / 0.5);
    p1ShieldFill.material.opacity = 0.28 + p1ShieldFlash * 0.5;
  }
  if (p2ShieldFlash > 0) {
    p2ShieldFlash = Math.max(0, p2ShieldFlash - dt / 0.5);
    p2ShieldFill.material.opacity = 0.28 + p2ShieldFlash * 0.5;
  }

  // Wall flash decay
  if (wallFlashLt > 0) { wallFlashLt = Math.max(0, wallFlashLt - dt / 0.35); wallFlashL.opacity = wallFlashLt * 0.35; }
  if (wallFlashRt > 0) { wallFlashRt = Math.max(0, wallFlashRt - dt / 0.35); wallFlashR.opacity = wallFlashRt * 0.35; }

  // Disc
  discMesh.position.copy(disc.pos);
  discMesh.visible = (gameState === 'playing' || gameState === 'serving');

  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
